name: Matou App Build

# when a new tag is pushed, it will run this workflow
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - desktop
          - linux
          - mac-arm64
          - mac-x64
          - windows
          - android
          # WP4 of docs/plans/2026-08-31-github-release-builds-spec.md: build the
          # Capacitor iOS shell — unsigned simulator app, booted and smoke-tested
          # on the runner, plus an unsigned device archive. Dispatch-only until
          # WP5 adds signing + TestFlight and folds it into `all` / tag runs.
          - ios
          # WP3: prove the embedded backend links for iOS (gomobile bind only).
          - ios-spike
      testflight:
        description: 'iOS: also upload the signed build to TestFlight (tags always do)'
        required: false
        default: false
        type: boolean

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      # Single source of truth for every platform job (desktop today; android/ios
      # per docs/plans/2026-08-31-github-release-builds-spec.md):
      #   version      = frontend/package.json version, must equal the tag minus 'v'
      #   build_number = MMMmmmppp from the tag (0.4.1 -> 4001), same scheme as the
      #                  Forgejo android.yml versionCode; run_number off a tag.
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}
      desktop: ${{ steps.set-matrix.outputs.desktop }}
      android: ${{ steps.set-matrix.outputs.android }}
      ios_spike: ${{ steps.set-matrix.outputs.ios_spike }}
      ios: ${{ steps.set-matrix.outputs.ios }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - id: version
        name: Derive version and build number
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./frontend/package.json').version")"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG="$GITHUB_REF_NAME"
            if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.]+)?$ ]]; then
              echo "::error::tag '$TAG' is not vX.Y.Z[-suffix]"
              exit 1
            fi
            if [[ "${TAG#v}" != "$VERSION" ]]; then
              echo "::error::tag '$TAG' does not match frontend/package.json version '$VERSION' — release with scripts/release.sh"
              exit 1
            fi
            BUILD_NUMBER=$(( 10#${BASH_REMATCH[1]} * 1000000 + 10#${BASH_REMATCH[2]} * 1000 + 10#${BASH_REMATCH[3]} ))
          else
            BUILD_NUMBER="$GITHUB_RUN_NUMBER"
          fi
          echo "version=$VERSION build_number=$BUILD_NUMBER"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

      - id: set-matrix
        run: |
          ALL='[{"id":"mac-x64","os":"macos-15-intel","platform":"mac","arch":"x64","make_target":"build-darwin-amd64"},{"id":"mac-arm64","os":"macos-latest","platform":"mac","arch":"arm64","make_target":"build-darwin-arm64"},{"id":"linux","os":"ubuntu-latest","platform":"linux","arch":"amd64","make_target":"build-linux-amd64"},{"id":"windows","os":"windows-2022","platform":"windows","arch":"amd64","make_target":"build-windows-amd64"}]'

          PLATFORM="${{ inputs.platform || 'all' }}"
          case "$PLATFORM" in
            all|desktop) FILTERED="$ALL" ;;
            android|ios|ios-spike) FILTERED='[]' ;;
            *)           FILTERED=$(echo "$ALL" | jq -c --arg id "$PLATFORM" '[.[] | select(.id == $id)]') ;;
          esac
          ANDROID=false
          case "$PLATFORM" in all|android) ANDROID=true ;; esac
          IOS_SPIKE=false
          [ "$PLATFORM" = "ios-spike" ] && IOS_SPIKE=true
          IOS=false
          case "$PLATFORM" in all|ios) IOS=true ;; esac
          DESKTOP=true
          [ "$FILTERED" = "[]" ] && DESKTOP=false
          echo "platform=$PLATFORM desktop=$DESKTOP android=$ANDROID ios=$IOS ios_spike=$IOS_SPIKE"
          echo "matrix={\"include\":$FILTERED}" >> "$GITHUB_OUTPUT"
          echo "desktop=$DESKTOP" >> "$GITHUB_OUTPUT"
          echo "android=$ANDROID" >> "$GITHUB_OUTPUT"
          echo "ios_spike=$IOS_SPIKE" >> "$GITHUB_OUTPUT"
          echo "ios=$IOS" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.desktop == 'true'
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      # Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Matou App Version (derived once in `prepare`, validated against the tag)
      - name: Get app version
        shell: bash
        run: |
          echo "VERSION=${{ needs.prepare.outputs.version }}" >> "$GITHUB_ENV"

      # Install frontend dependencies
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      # Install Quasar CLI
      - name: Install Quasar CLI
        run: npm install -g @quasar/cli

      # Set up Go
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # Backend set up
      - name: Prepare backend modules
        run: |
          cd backend
          go mod tidy

      # Build backend
      - name: Build backend
        shell: bash {0}
        run: |
          cd backend
          make ${{ matrix.make_target }}

      # Verify backend binary
      - name: Verify backend binary
        shell: bash
        run: |
          cd backend

          # Determine expected binary path from make_target
          case "${{ matrix.make_target }}" in
            build-darwin-arm64)  BIN="bin/darwin-arm64/matou-backend" ;;
            build-darwin-amd64)  BIN="bin/darwin-amd64/matou-backend" ;;
            build-linux-amd64)   BIN="bin/linux-amd64/matou-backend" ;;
            build-windows-amd64) BIN="bin/windows-amd64/matou-backend.exe" ;;
          esac

          # 1. Verify binary exists
          if [ ! -f "$BIN" ]; then
            echo "::error::Backend binary not found at $BIN"
            exit 1
          fi
          echo "Binary found: $BIN ($(stat --format='%s' "$BIN" 2>/dev/null || stat -f '%z' "$BIN") bytes)"

          # 2. Verify binary format matches target platform
          FILE_INFO=$(file "$BIN")
          echo "File type: $FILE_INFO"

          case "${{ matrix.make_target }}" in
            build-darwin-arm64)  echo "$FILE_INFO" | grep -qi "Mach-O.*arm64" || { echo "::error::Expected Mach-O arm64 binary"; exit 1; } ;;
            build-darwin-amd64)  echo "$FILE_INFO" | grep -qi "Mach-O.*x86_64" || { echo "::error::Expected Mach-O x86_64 binary"; exit 1; } ;;
            build-linux-amd64)   echo "$FILE_INFO" | grep -qi "ELF.*x86-64" || { echo "::error::Expected ELF x86-64 binary"; exit 1; } ;;
            build-windows-amd64) echo "$FILE_INFO" | grep -qi "PE32\+\|x86-64\|Windows" || { echo "::error::Expected PE32+ Windows binary"; exit 1; } ;;
          esac
          echo "Binary format verified"

          # 3. On native platform, run the binary briefly to verify it executes
          #    The binary will print its banner then crash on missing config — that's fine,
          #    we just need to confirm it's a working executable.
          if [[ "${{ matrix.platform }}" != "windows" ]]; then
            chmod +x "$BIN"
            ./"$BIN" > /tmp/backend-output.txt 2>&1 &
            BIN_PID=$!
            sleep 5
            kill $BIN_PID 2>/dev/null || true
            wait $BIN_PID 2>/dev/null || true
            OUTPUT=$(cat /tmp/backend-output.txt)
            if echo "$OUTPUT" | grep -q "MATOU DAO Backend Server"; then
              echo "Binary executes correctly (startup banner detected)"
            else
              echo "::error::Binary did not produce expected startup banner"
              echo "Output was: $OUTPUT"
              exit 1
            fi
          else
            echo "Skipping execution test on Windows (cross-platform binary check only)"
          fi

      # Setup macOS Signing
      - name: Setup macOS Signing (if mac)
        if: matrix.platform == 'mac'
        shell: bash
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          # Write the App Store Connect API key outside the checkout so it can never
          # land in an artefact upload; the build step points APPLE_API_KEY at it.
          umask 077
          printf '%s\n' "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/AuthKey.p8"

      # Build Electron app
      - name: Build Electron App
        shell: bash {0}
        run: |
          cd frontend
          
          if [[ "${{ matrix.platform }}" == "mac" ]]; then
            npx quasar build -m electron --mac --${{ matrix.arch }} --publish=always
          else
            npx quasar build -m electron --publish=always
          fi
        env:
          # electron releasing and publishing
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

          # apple macOS code signing + notarization
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

          # vite
          VITE_PROD_CONFIG_URL: ${{ secrets.VITE_PROD_CONFIG_URL }}
          VITE_ENV: ${{ secrets.VITE_ENV }}
          VITE_SMTP_HOST: ${{ secrets.VITE_SMTP_HOST }}
          VITE_SMTP_PORT: ${{ secrets.VITE_SMTP_PORT }}


      # Smoke test - verify the packaged app contains the backend and is runnable
      - name: Smoke test - AppImage packaging (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb

          APPIMAGE=$(find frontend/dist/electron/Packaged -name '*.AppImage' | head -1)
          if [ -z "$APPIMAGE" ]; then
            echo "::error::No AppImage found in build output"
            exit 1
          fi
          echo "Found AppImage: $APPIMAGE"
          chmod +x "$APPIMAGE"

          # Extract (no FUSE in CI runners)
          "$APPIMAGE" --appimage-extract > /dev/null 2>&1
          echo "AppImage extracted to squashfs-root/"

          # Verify the wrapper script exists (afterPack.cjs creates this for --no-sandbox)
          if [ -f "squashfs-root/matou" ]; then
            if grep -q "no-sandbox" "squashfs-root/matou"; then
              echo "Sandbox wrapper script verified"
            else
              echo "::warning::Wrapper script exists but missing --no-sandbox flag"
            fi
          fi

          # Verify backend binary is bundled at the expected path
          BACKEND_BIN="squashfs-root/resources/backend/linux-amd64/matou-backend"
          if [ ! -f "$BACKEND_BIN" ]; then
            echo "::error::Backend binary not found in package at $BACKEND_BIN"
            echo "Contents of resources/backend/:"
            find squashfs-root/resources/backend/ -type f 2>/dev/null || echo "(directory not found)"
            exit 1
          fi
          echo "Backend binary found in package: $BACKEND_BIN"

          # Verify the backend binary executes inside the package
          chmod +x "$BACKEND_BIN"
          "$BACKEND_BIN" > /tmp/pkg-backend-output.txt 2>&1 &
          PKG_PID=$!
          sleep 5
          kill $PKG_PID 2>/dev/null || true
          wait $PKG_PID 2>/dev/null || true
          OUTPUT=$(cat /tmp/pkg-backend-output.txt)
          if echo "$OUTPUT" | grep -q "MATOU DAO Backend Server"; then
            echo "Packaged backend binary executes correctly"
          else
            echo "::error::Packaged backend binary did not produce startup banner"
            echo "Output was: $OUTPUT"
            exit 1
          fi

          # Launch the full Electron app briefly to verify it starts
          xvfb-run --auto-servernum ./squashfs-root/matou --no-sandbox &
          APP_PID=$!
          sleep 10

          # Check the process is still alive (didn't crash immediately)
          if kill -0 $APP_PID 2>/dev/null; then
            echo "Electron app process is running after 10s (PID $APP_PID)"
            kill $APP_PID 2>/dev/null || true
            wait $APP_PID 2>/dev/null || true
          else
            echo "::error::Electron app process died within 10s"
            exit 1
          fi

          rm -rf squashfs-root/

      - name: Smoke test - DMG packaging (macOS)
        if: matrix.platform == 'mac'
        run: |
          DMG=$(find frontend/dist/electron/Packaged -name '*.dmg' | head -1)
          if [ -z "$DMG" ]; then
            echo "::error::No DMG found in build output"
            exit 1
          fi
          echo "Found DMG: $DMG"

          # Mount the DMG
          hdiutil attach "$DMG" -nobrowse -quiet
          MOUNT=$(find /Volumes -maxdepth 1 -name 'Matou*' | head -1)
          if [ -z "$MOUNT" ]; then
            echo "::error::DMG mounted but Matou volume not found"
            exit 1
          fi
          echo "DMG mounted at: $MOUNT"

          # Verify the .app bundle exists
          APP_BUNDLE=$(find "$MOUNT" -maxdepth 1 -name '*.app' | head -1)
          if [ -z "$APP_BUNDLE" ]; then
            echo "::error::No .app bundle found in DMG"
            hdiutil detach "$MOUNT" -quiet
            exit 1
          fi
          echo "App bundle: $APP_BUNDLE"

          # Map runner arch to binary directory
          case "${{ matrix.arch }}" in
            arm64) ARCH_DIR="darwin-arm64" ;;
            x64)   ARCH_DIR="darwin-amd64" ;;
          esac

          # Verify backend binary is bundled at the expected path
          BACKEND_BIN="$APP_BUNDLE/Contents/Resources/backend/$ARCH_DIR/matou-backend"
          if [ ! -f "$BACKEND_BIN" ]; then
            echo "::error::Backend binary not found in app bundle at $BACKEND_BIN"
            echo "Contents of Resources/backend/:"
            find "$APP_BUNDLE/Contents/Resources/backend/" -type f 2>/dev/null || echo "(directory not found)"
            hdiutil detach "$MOUNT" -quiet
            exit 1
          fi
          echo "Backend binary found in app bundle"

          # Verify the backend binary executes
          "$BACKEND_BIN" > /tmp/dmg-backend-output.txt 2>&1 &
          DMG_PID=$!
          sleep 5
          kill $DMG_PID 2>/dev/null || true
          wait $DMG_PID 2>/dev/null || true
          OUTPUT=$(cat /tmp/dmg-backend-output.txt)
          if echo "$OUTPUT" | grep -q "MATOU DAO Backend Server"; then
            echo "Packaged backend binary executes correctly"
          else
            echo "::error::Packaged backend binary did not produce startup banner"
            echo "Output was: $OUTPUT"
            hdiutil detach "$MOUNT" -quiet
            exit 1
          fi

          # Verify code signing (macOS-specific)
          if codesign --verify --deep --strict "$APP_BUNDLE" 2>/dev/null; then
            echo "Code signature verified"
          else
            echo "::warning::Code signature verification failed (may be expected without signing secrets)"
          fi

          hdiutil detach "$MOUNT" -quiet

      - name: Smoke test - NSIS installer (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path frontend/dist/electron/Packaged -Filter '*.exe' -Recurse | Select-Object -First 1
          if (-not $exe) {
            Write-Error "No .exe installer found in build output"
            exit 1
          }
          Write-Host "Found installer: $($exe.FullName)"

          # Run the NSIS installer silently
          $installDir = "$env:TEMP\MatouSmokeTest"
          Write-Host "Installing to: $installDir"
          $proc = Start-Process $exe.FullName -ArgumentList '/S', "/D=$installDir" -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
            Write-Error "Installer exited with code $($proc.ExitCode)"
            exit 1
          }

          # Verify installation directory exists
          if (-not (Test-Path $installDir)) {
            Write-Error "Installation directory not found at $installDir"
            exit 1
          }

          # Verify backend binary is bundled
          $backendBin = Get-ChildItem -Path "$installDir\resources\backend\windows-amd64" -Filter 'matou-backend.exe' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $backendBin) {
            Write-Error "Backend binary not found in installed app"
            Write-Host "Contents of resources\backend\:"
            Get-ChildItem "$installDir\resources\backend\" -Recurse -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }
            exit 1
          }
          Write-Host "Backend binary found: $($backendBin.FullName)"

          # Verify the backend binary executes
          $output = & $backendBin.FullName 2>&1 | Out-String
          if ($output -match "MATOU DAO Backend Server") {
            Write-Host "Packaged backend binary executes correctly"
          } else {
            Write-Error "Packaged backend binary did not produce startup banner"
            Write-Host "Output was: $output"
            exit 1
          }

          # Verify main Electron executable exists
          $mainExe = Get-ChildItem -Path $installDir -Filter 'Matou.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($mainExe) {
            Write-Host "Main executable found: $($mainExe.FullName)"
          } else {
            Write-Error "Main Matou.exe not found in installation"
            exit 1
          }

          # All checks passed
          exit 0

      # Upload artifacts
      - name: Upload ${{ matrix.platform }} artifacts
        uses: actions/upload-artifact@v4
        with:
          name: matou-${{ env.VERSION }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: frontend/dist/electron/Packaged/**
          if-no-files-found: error

  # Android: signed Play App Bundle + sideload APK (spec WP2). Same recipe as
  # the Forgejo android.yml build-aab job — setup-toolchain.sh, build-aab.sh and
  # build.gradle are shared unchanged — so versionCode/versionName come from
  # `prepare` like every other platform. Signing secrets: docs/SECRETS_CHECKLIST.md
  # "GitHub release secrets". Without them a workflow_dispatch run still builds
  # UNSIGNED smoke artefacts (never uploadable to Play); a tag run fails hard.
  android:
    needs: prepare
    if: needs.prepare.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # ~2.9 GB (JDK 21 + SDK/NDK r27c + gomobile) on a cold runner; the script is
      # idempotent, so a cache hit makes it a no-op.
      - name: Cache Android toolchain
        uses: actions/cache@v4
        with:
          path: ~/.matou-android
          key: matou-android-toolchain-${{ runner.os }}-${{ hashFiles('scripts/android/setup-toolchain.sh') }}

      - name: Install Android toolchain (idempotent, cached in ~/.matou-android)
        run: bash scripts/android/setup-toolchain.sh

      - name: gomobile bind — embedded backend .aar
        run: make -C backend build-android-aar

      - name: Verify libgojni.so is 16 KB page-aligned (#167)
        run: |
          set -euo pipefail
          # shellcheck disable=SC1090
          . "$HOME/.matou-android/env.sh"
          aar="frontend/src-capacitor/android/app/libs/matou.aar"
          readelf="$(find "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt" \( -type f -o -type l \) -name llvm-readelf | head -1)"
          [ -n "$readelf" ] || { echo "::error::llvm-readelf not found under NDK"; exit 1; }
          tmp="$(mktemp -d)"
          python3 -c 'import sys,zipfile; zipfile.ZipFile(sys.argv[1]).extract("jni/arm64-v8a/libgojni.so", sys.argv[2])' "$aar" "$tmp"
          so="$tmp/jni/arm64-v8a/libgojni.so"
          "$readelf" -l "$so" | awk '/LOAD/'
          bad="$("$readelf" -l "$so" | awk '/LOAD/ && $NF != "0x4000" {print}')"
          if [ -n "$bad" ]; then
            echo "::error::libgojni.so has LOAD segments not aligned to 0x4000 (16 KB):"
            echo "$bad"
            exit 1
          fi
          echo "OK: all LOAD segments aligned to 0x4000"

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build release AAB + APK
        id: build
        env:
          VITE_PROD_CONFIG_URL: ${{ secrets.VITE_PROD_CONFIG_URL }}
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          MATOU_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MATOU_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MATOU_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          MATOU_VERSION_CODE: ${{ needs.prepare.outputs.build_number }}
          MATOU_VERSION_NAME: ${{ needs.prepare.outputs.version }}
          # Firebase config for push (#177), base64 of google-services.json.
          # Unset → build-aab.sh builds without push (plugin skipped).
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          unsigned_flag=""
          if [ -z "$ANDROID_KEYSTORE_B64" ]; then
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              echo "::error::ANDROID_KEYSTORE_B64 secret is not set — a tagged release must be signed (docs/SECRETS_CHECKLIST.md)"
              exit 1
            fi
            echo "::warning::ANDROID_KEYSTORE_B64 not set — building UNSIGNED smoke artefacts (workflow_dispatch only, never upload to Play)"
            unsigned_flag="--allow-unsigned"
            unset MATOU_KEYSTORE_PASSWORD MATOU_KEY_ALIAS MATOU_KEY_PASSWORD
            signed=false
          else
            ks="$RUNNER_TEMP/upload.jks"
            printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > "$ks"
            chmod 600 "$ks"
            export MATOU_KEYSTORE_FILE="$ks"
            signed=true
          fi
          trap 'rm -f "$RUNNER_TEMP/upload.jks"' EXIT

          bash scripts/android/build-aab.sh $unsigned_flag

          # build-aab.sh leaves the release web assets synced into the Android
          # project, so the sideload APK is one more gradle task with the same
          # signing config.
          # shellcheck disable=SC1090
          . "$HOME/.matou-android/env.sh"
          (cd frontend/src-capacitor/android && ./gradlew --no-daemon assembleRelease)

          mkdir -p out
          cp frontend/dist/capacitor/android/bundle/release/app-release.aab "out/matou-${VERSION}-android.aab"
          apk="$(ls frontend/src-capacitor/android/app/build/outputs/apk/release/app-release*.apk | head -1)"
          cp "$apk" "out/matou-${VERSION}-android.apk"
          ls -la out
          echo "signed=$signed" >> "$GITHUB_OUTPUT"

      - name: Verify AAB + APK (applicationId, versionCode, versionName, signer)
        env:
          SIGNED: ${{ steps.build.outputs.signed }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC1090
          . "$HOME/.matou-android/env.sh"
          bt="$ANDROID_HOME/build-tools/34.0.0"
          apk="out/matou-${VERSION}-android.apk"
          aab="out/matou-${VERSION}-android.aab"

          echo "==> APK badging"
          badging="$("$bt/aapt2" dump badging "$apk" | head -1)"
          echo "$badging"
          echo "$badging" | grep -q "name='nz.matou.app'"            || { echo "::error::applicationId is not nz.matou.app"; exit 1; }
          echo "$badging" | grep -q "versionCode='${BUILD_NUMBER}'"   || { echo "::error::versionCode != ${BUILD_NUMBER}"; exit 1; }
          echo "$badging" | grep -q "versionName='${VERSION}'"        || { echo "::error::versionName != ${VERSION}"; exit 1; }

          echo "==> AAB contents"
          python3 - "$aab" <<'PY'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          for want in ("BundleConfig.pb", "base/manifest/AndroidManifest.xml", "base/lib/arm64-v8a/libgojni.so"):
              if want not in names:
                  sys.exit(f"missing {want} in bundle")
          print("bundle ok:", len(names), "entries")
          PY

          if [ "$SIGNED" = "true" ]; then
            echo "==> APK signature"
            "$bt/apksigner" verify --print-certs "$apk"
            echo "==> AAB signature"
            jarsigner -verify -verbose:summary -certs "$aab" | grep -E "CN=|jar verified" | sort -u
          else
            echo "::warning::unsigned smoke build — signature checks skipped"
          fi

      - name: Upload Android artefacts
        uses: actions/upload-artifact@v4
        with:
          name: matou-${{ needs.prepare.outputs.version }}-android
          path: out/*
          if-no-files-found: error

  # Attach the mobile installers to the draft release that electron-builder
  # creates for the desktop targets (spec WP6, mobile half). Tag runs only; the
  # release stays a draft for a human to publish after checking Play/TestFlight.
  # iOS Phase 0 (spec WP3, Forgejo #29): does the full backend — any-sync,
  # quic-go, modernc sqlite, KERI — link through gomobile for ios + iossimulator?
  # workflow_dispatch(platform=ios-spike) only. Produces Matou.xcframework as an
  # artefact and prints the generated Objective-C header so MobileStart/MobileStop
  # can be eyeballed. Nothing downstream consumes it yet (WP4 vendors it into the
  # Capacitor iOS shell).
  ios-spike:
    needs: prepare
    if: needs.prepare.outputs.ios_spike == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      # Same x/mobile revision as scripts/android/setup-toolchain.sh and go.mod.
      XMOBILE_VERSION: v0.0.0-20260812174124-2f419b2fb945
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          go version

      - name: Install gomobile + gobind (pinned)
        run: |
          set -euo pipefail
          go install "golang.org/x/mobile/cmd/gomobile@$XMOBILE_VERSION"
          go install "golang.org/x/mobile/cmd/gobind@$XMOBILE_VERSION"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/gomobile" init
          "$(go env GOPATH)/bin/gomobile" version

      - name: gomobile bind (ios, iossimulator)
        id: bind
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/Matou.xcframework"
          IOS_XCFRAMEWORK="$OUT" make -C backend build-ios-xcframework
          echo "xcframework=$OUT" >> "$GITHUB_OUTPUT"

      - name: Inspect the xcframework
        run: |
          set -euo pipefail
          OUT="${{ steps.bind.outputs.xcframework }}"
          echo "== bundle layout"
          find "$OUT" -maxdepth 2 | sort
          echo
          echo "== Info.plist (slices)"
          plutil -p "$OUT/Info.plist"
          echo
          # The device slice: ios-arm64/Matou.framework/Matou
          DEVICE_FW="$(find "$OUT" -maxdepth 2 -type d -name 'ios-arm64' | head -1)/Matou.framework"
          SIM_FW="$(find "$OUT" -maxdepth 2 -type d -name 'ios-*simulator' | head -1)/Matou.framework"
          test -f "$DEVICE_FW/Matou" || { echo "::error::device slice missing at $DEVICE_FW"; exit 1; }
          test -f "$SIM_FW/Matou" || { echo "::error::simulator slice missing at $SIM_FW"; exit 1; }
          echo "== lipo -info (device)";    lipo -info "$DEVICE_FW/Matou"
          echo "== lipo -info (simulator)"; lipo -info "$SIM_FW/Matou"
          echo "== otool -L (device)";      otool -L "$DEVICE_FW/Matou" || true
          echo "== vtool -show-build (device)"; xcrun vtool -show-build "$DEVICE_FW/Matou" || true
          echo "== sizes"; du -sh "$DEVICE_FW/Matou" "$SIM_FW/Matou"
          echo
          echo "== generated header (device slice)"
          HDR="$DEVICE_FW/Headers/Mobile.objc.h"
          test -f "$HDR" || { echo "::error::Mobile.objc.h not generated"; find "$DEVICE_FW/Headers"; exit 1; }
          cat "$HDR"
          # Acceptance: the two entry points the Swift plugin will call.
          grep -q 'MobileStart(' "$HDR" || { echo "::error::MobileStart missing from header"; exit 1; }
          grep -q 'MobileStop('  "$HDR" || { echo "::error::MobileStop missing from header"; exit 1; }
          {
            echo "## iOS spike — gomobile bind PASSED"
            echo
            echo '```'
            lipo -info "$DEVICE_FW/Matou"; lipo -info "$SIM_FW/Matou"; du -sh "$DEVICE_FW/Matou" "$SIM_FW/Matou"
            echo '```'
            echo
            echo '<details><summary>Mobile.objc.h</summary>'
            echo; echo '```objc'; cat "$HDR"; echo '```'; echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Zip xcframework
        # ditto keeps the bundle layout (upload-artifact would flatten the top
        # directory); this is also how xcframeworks are normally distributed.
        run: |
          set -euo pipefail
          OUT="${{ steps.bind.outputs.xcframework }}"
          ditto -c -k --keepParent "$OUT" "$RUNNER_TEMP/Matou.xcframework.zip"
          shasum -a 256 "$RUNNER_TEMP/Matou.xcframework.zip" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload xcframework
        uses: actions/upload-artifact@v4
        with:
          name: Matou.xcframework
          path: ${{ runner.temp }}/Matou.xcframework.zip
          if-no-files-found: error
          retention-days: 14

  # iOS app (spec WP4 + WP5): Capacitor shell + Swift plugins around the gomobile
  # backend. Builds the unsigned Simulator app, boots it on the runner and checks
  # the embedded backend comes up (os_log "backend up" + GET /health through the
  # shared loopback), then signs a Release archive, exports an App Store IPA and —
  # on a tag, or on dispatch with testflight=true — uploads it to TestFlight.
  # Without the signing secrets it falls back to an unsigned archive.
  ios:
    needs: prepare
    if: needs.prepare.outputs.ios == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      XMOBILE_VERSION: v0.0.0-20260812174124-2f419b2fb945
      VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            frontend/src-capacitor/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          go version
          pod --version
          df -h /

      - name: Install gomobile + gobind (pinned)
        run: |
          set -euo pipefail
          go install "golang.org/x/mobile/cmd/gomobile@$XMOBILE_VERSION"
          go install "golang.org/x/mobile/cmd/gobind@$XMOBILE_VERSION"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/gomobile" init

      - name: gomobile bind — embedded backend xcframework
        run: make -C backend build-ios-xcframework

      - name: Install frontend dependencies
        run: |
          (cd frontend && npm ci)
          (cd frontend/src-capacitor && npm ci)

      - name: Build Simulator app (unsigned)
        env:
          VITE_PROD_CONFIG_URL: ${{ secrets.VITE_PROD_CONFIG_URL }}
          MATOU_VERSION_CODE: ${{ needs.prepare.outputs.build_number }}
          MATOU_VERSION_NAME: ${{ needs.prepare.outputs.version }}
        run: bash scripts/ios/build-ipa.sh --simulator

      - name: Boot Simulator and smoke-test the embedded backend
        id: smoke
        run: |
          set -euo pipefail
          APP=frontend/dist/capacitor/ios/simulator/Matou.app
          EV="$RUNNER_TEMP/ios-smoke"; mkdir -p "$EV"
          echo "== bundle"
          plutil -p "$APP/Info.plist" | grep -E "CFBundle(Identifier|ShortVersionString|Version)\""
          UDID="$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.isAvailable and (.name | test("^iPhone")))] | last | .udid')"
          test -n "$UDID" && test "$UDID" != null || { echo "::error::no available iPhone simulator"; xcrun simctl list devices; exit 1; }
          echo "== simulator $UDID"; xcrun simctl list devices available | grep "$UDID"
          echo "== bundle contents"; ls "$APP"; cat "$APP/capacitor.config.json"; ls "$APP/public" | head
          file "$APP/public"; test -d "$APP/public" || { echo "::error::public is not a directory in the bundle"; exit 1; }
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          # --console-pty attaches a pty, so Swift `print` (Capacitor's own log
          # lines and the forwarded WebView console) is line-buffered and lands in
          # the file as it happens; plain file redirection block-buffers it.
          xcrun simctl launch --console-pty "$UDID" nz.matou.app > "$EV/console.log" 2>&1 &
          CONSOLE_PID=$!
          echo "== installed container"; CONTAINER="$(xcrun simctl get_app_container "$UDID" nz.matou.app 2>/dev/null || true)"
          [ -n "$CONTAINER" ] && { ls -la "$CONTAINER" | head -20; file "$CONTAINER/public"; }
          oslog() { xcrun simctl spawn "$UDID" log show --style compact --info --last 10m --predicate 'subsystem == "nz.matou.app"' 2>/dev/null || true; }
          PORT=""
          for i in $(seq 1 36); do
            sleep 5
            L="$(oslog)"
            if UP="$(printf '%s\n' "$L" | grep -m1 'backend up on 127.0.0.1:')"; then
              PORT="${UP##*127.0.0.1:}"; PORT="${PORT%%[^0-9]*}"; break
            fi
            if printf '%s\n' "$L" | grep -q 'backend start failed'; then break; fi
          done
          # Give the WebView a moment to render whatever it got, then capture evidence.
          sleep 5
          xcrun simctl io "$UDID" screenshot "$EV/screenshot.png"
          oslog > "$EV/oslog.txt"
          xcrun simctl spawn "$UDID" log show --style compact --last 10m --predicate 'process == "App"' > "$EV/oslog-app-process.txt" 2>/dev/null || true
          echo "== os_log (nz.matou.app)"; tail -40 "$EV/oslog.txt"
          echo "== app console (Capacitor + WebView console + Go stderr, tail)"; tail -80 "$EV/console.log" || true
          if [ -z "$PORT" ]; then
            echo "== os_log (process App, errors/faults)"; grep -E " (E|F) " "$EV/oslog-app-process.txt" | tail -40 || true
            echo "::error::embedded backend did not report 'backend up' within 3 minutes — see the ios-smoke artefact"
            exit 1
          fi
          echo "== backend port $PORT — GET /health from the runner (simulator shares the host loopback)"
          curl -sS --max-time 15 "http://127.0.0.1:$PORT/health" | tee "$EV/health.json"; echo
          # The Swift plugins must work, not merely load: the backend comes up even
          # when the Keychain rejects every call, so assert on the app console too.
          if grep -q "SecureStorage: .* failed" "$EV/console.log"; then
            echo "::error::SecureStorage plugin failed at runtime — see the ios-smoke artefact"
            grep -m3 "SecureStorage: .* failed" "$EV/console.log"
            exit 1
          fi
          # Proves the whole WebView -> loopback backend -> config server chain, which
          # is how a Capacitor build sources its client config (issue #99).
          if ! grep -q "Client config loaded" "$EV/console.log"; then
            echo "::error::the WebView never loaded its client config through the embedded backend"
            exit 1
          fi
          # Expected before an org exists: the backend serves org config from its own
          # cache only (it mirrors to the config server, never fetches from it), and a
          # WebView cannot fetch the plain-http config server directly on EITHER mobile
          # platform — capacitor:// and https://localhost are secure origins, so that
          # request is mixed content, and Android additionally permits cleartext to
          # loopback only. Same screen on Android; tracked as an app-level follow-up,
          # not an iOS shell problem.
          if grep -q "All servers unreachable" "$EV/console.log"; then
            echo "::notice::org config unavailable (no org configured yet) — expected on a fresh install, matches Android"
          fi
          {
            echo "## iOS Simulator smoke — backend up on 127.0.0.1:$PORT"
            echo; echo '```'; cat "$EV/health.json"; echo; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          xcrun simctl terminate "$UDID" nz.matou.app || true
          kill "$CONSOLE_PID" 2>/dev/null || true

      - name: Upload smoke evidence (screenshot, logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-smoke
          path: ${{ runner.temp }}/ios-smoke
          if-no-files-found: ignore
          retention-days: 14

      - name: Zip Simulator app
        run: |
          set -euo pipefail
          ditto -c -k --keepParent frontend/dist/capacitor/ios/simulator/Matou.app "$RUNNER_TEMP/Matou-simulator.app.zip"
          shasum -a 256 "$RUNNER_TEMP/Matou-simulator.app.zip" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload Simulator app
        uses: actions/upload-artifact@v4
        with:
          name: matou-${{ needs.prepare.outputs.version }}-ios-simulator
          path: ${{ runner.temp }}/Matou-simulator.app.zip
          if-no-files-found: error
          retention-days: 14

      # The Debug Simulator build's DerivedData plus the Go and gomobile caches fill
      # the runner: the Release archive died mid-rsync with "Input/output error"
      # writing Capacitor.framework (run 33463417761). Everything below is either
      # already uploaded or rebuilt from scratch by the archive, and nothing after
      # this point needs Go — only the xcframework, which is kept.
      - name: Reclaim disk space before the archive
        run: |
          set -euo pipefail
          df -h /
          xcrun simctl shutdown all || true
          xcrun simctl delete unavailable || true
          rm -rf frontend/dist/capacitor/ios/DerivedData frontend/dist/capacitor/ios/simulator
          go clean -cache -testcache || true
          go clean -modcache || true
          df -h /

      # Certificate into a throwaway keychain, profile into both directories Xcode
      # looks in (16 moved it). Team id and profile name are read back out of the
      # profile itself rather than trusted from a secret, so a mismatched trio
      # fails here with a clear message instead of deep inside xcodebuild.
      - name: Import signing assets
        id: signing
        env:
          APPLE_IOS_CERT_B64: ${{ secrets.APPLE_IOS_CERT_B64 }}
          APPLE_IOS_CERT_PASSWORD: ${{ secrets.APPLE_IOS_CERT_PASSWORD }}
          APPLE_IOS_PROFILE_B64: ${{ secrets.APPLE_IOS_PROFILE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "$APPLE_IOS_CERT_B64" ] || [ -z "$APPLE_IOS_PROFILE_B64" ]; then
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              echo "::error::iOS signing secrets are not set — a tagged release must be signed (docs/SECRETS_CHECKLIST.md)"
              exit 1
            fi
            echo "::warning::iOS signing secrets not set — falling back to an unsigned archive"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/matou-signing.keychain-db"
          KEYCHAIN_PW="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"   # don't relock mid-build
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          # Prepend ours, keeping the login/System keychains searchable so Apple's
          # WWDR intermediate still resolves.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')
          umask 077
          printf '%s' "$APPLE_IOS_CERT_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$APPLE_IOS_CERT_PASSWORD" \
            -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          # Without this codesign blocks on a GUI prompt for the private key.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          echo "== code-signing identities"
          security find-identity -v -p codesigning "$KEYCHAIN"

          PROFILE="$RUNNER_TEMP/matou.mobileprovision"
          printf '%s' "$APPLE_IOS_PROFILE_B64" | base64 --decode > "$PROFILE"
          PLIST="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$PROFILE" > "$PLIST"
          UUID="$(plutil -extract UUID raw -o - "$PLIST")"
          TEAM="$(plutil -extract TeamIdentifier.0 raw -o - "$PLIST")"
          NAME="$(plutil -extract Name raw -o - "$PLIST")"
          APPID="$(plutil -extract Entitlements.application-identifier raw -o - "$PLIST")"
          echo "profile '$NAME' uuid=$UUID team=$TEAM application-identifier=$APPID"
          if [ "$APPID" != "$TEAM.nz.matou.app" ]; then
            echo "::error::profile is for $APPID, expected $TEAM.nz.matou.app"
            exit 1
          fi
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                   "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d"; cp "$PROFILE" "$d/$UUID.mobileprovision"
          done
          {
            echo "signed=true"
            echo "team_id=$TEAM"
            echo "profile_name=$NAME"
          } >> "$GITHUB_OUTPUT"

      - name: Signed Release archive + App Store IPA
        if: steps.signing.outputs.signed == 'true'
        env:
          VITE_PROD_CONFIG_URL: ${{ secrets.VITE_PROD_CONFIG_URL }}
          MATOU_VERSION_CODE: ${{ needs.prepare.outputs.build_number }}
          MATOU_VERSION_NAME: ${{ needs.prepare.outputs.version }}
          MATOU_IOS_TEAM_ID: ${{ steps.signing.outputs.team_id }}
          MATOU_IOS_PROFILE_NAME: ${{ steps.signing.outputs.profile_name }}
        run: |
          set -euo pipefail
          bash scripts/ios/build-ipa.sh
          IPA="frontend/dist/capacitor/ios/ipa/matou-${VERSION}-ios.ipa"
          APP=frontend/dist/capacitor/ios/archive/Matou.xcarchive/Products/Applications/App.app
          echo "== archive app"
          plutil -p "$APP/Info.plist" | grep -E "CFBundle(Identifier|ShortVersionString|Version)\"|MinimumOSVersion"
          lipo -info "$APP/App"
          test -f "$APP/PrivacyInfo.xcprivacy" && echo "PrivacyInfo.xcprivacy present"
          echo "== signature"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | grep -E "Authority|TeamIdentifier|Identifier=" || true
          echo "== embedded entitlements"
          codesign -d --entitlements - --xml "$APP" 2>/dev/null | plutil -p - || true
          test -f "$IPA" || { echo "::error::no IPA at $IPA"; exit 1; }
          echo "== ipa"; ls -lh "$IPA"
          {
            echo "## iOS — signed App Store IPA"
            echo
            echo '```'
            codesign -dv --verbose=2 "$APP" 2>&1 | grep -E "Authority|TeamIdentifier|Identifier=" || true
            shasum -a 256 "$IPA"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload IPA artefact
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: matou-${{ needs.prepare.outputs.version }}-ios
          path: frontend/dist/capacitor/ios/ipa/matou-${{ needs.prepare.outputs.version }}-ios.ipa
          if-no-files-found: error
          retention-days: 14

      # Publishing step: a tag always uploads; a dispatch only when explicitly
      # asked, so nobody pushes a build to real testers by running the job.
      - name: Upload to TestFlight
        if: steps.signing.outputs.signed == 'true' && (github.ref_type == 'tag' || inputs.testflight)
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          set -euo pipefail
          if [ -z "$APPLE_API_KEY_ID" ] || [ -z "$APPLE_API_ISSUER" ] || [ -z "$APPLE_API_KEY_CONTENT" ]; then
            echo "::error::App Store Connect API secrets missing — cannot upload to TestFlight"
            exit 1
          fi
          # altool looks for the key by convention; it must not be world-readable.
          umask 077
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s\n' "$APPLE_API_KEY_CONTENT" > "$HOME/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          IPA="frontend/dist/capacitor/ios/ipa/matou-${VERSION}-ios.ipa"
          echo "== validate"
          xcrun altool --validate-app -f "$IPA" -t ios \
            --apiKey "$APPLE_API_KEY_ID" --apiIssuer "$APPLE_API_ISSUER"
          echo "== upload"
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$APPLE_API_KEY_ID" --apiIssuer "$APPLE_API_ISSUER"
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          echo "::notice::uploaded $VERSION ($BUILD_NUMBER) to TestFlight — processing takes a few minutes before it appears"
          echo "### iOS $VERSION ($BUILD_NUMBER) uploaded to TestFlight" >> "$GITHUB_STEP_SUMMARY"

      - name: Unsigned Release device archive (no signing secrets)
        if: steps.signing.outputs.signed != 'true'
        env:
          VITE_PROD_CONFIG_URL: ${{ secrets.VITE_PROD_CONFIG_URL }}
          MATOU_VERSION_CODE: ${{ needs.prepare.outputs.build_number }}
          MATOU_VERSION_NAME: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          bash scripts/ios/build-ipa.sh --unsigned-archive
          APP=frontend/dist/capacitor/ios/archive/Matou.xcarchive/Products/Applications/App.app
          echo "== archive app"; plutil -p "$APP/Info.plist" | grep -E "CFBundle(Identifier|ShortVersionString|Version)\"|MinimumOSVersion"
          lipo -info "$APP/App"
          test -f "$APP/PrivacyInfo.xcprivacy" && echo "PrivacyInfo.xcprivacy present"

      - name: Tear down the signing keychain
        if: always() && steps.signing.outputs.signed == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/matou-signing.keychain-db" 2>/dev/null || true
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision \
                "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/"*.mobileprovision 2>/dev/null || true

  release:
    # `ios` is in needs so its artefact can be attached, but the release is NOT
    # gated on it: Android is the shipping mobile platform, and a flaky iOS run
    # must not withhold the Mac/Linux/Windows/Android assets. A failed iOS job
    # is called out in the summary instead.
    needs: [prepare, build, android, ios]
    if: always() && github.ref_type == 'tag' && needs.android.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Download Android artefacts
        uses: actions/download-artifact@v4
        with:
          name: matou-${{ needs.prepare.outputs.version }}-android
          path: out

      - name: Download iOS IPA
        if: needs.ios.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: matou-${{ needs.prepare.outputs.version }}-ios
          path: out

      - name: Attach to the draft release
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Desktop jobs normally create the draft; if they all failed, make it ourselves.
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" out/* --repo "$GITHUB_REPOSITORY" --clobber
          {
            echo "### $TAG — mobile installers attached to the draft release"
            echo
            echo "| file | size | sha256 |"
            echo "| --- | --- | --- |"
            for f in out/*; do
              echo "| $(basename "$f") | $(du -h "$f" | cut -f1) | \`$(sha256sum "$f" | cut -c1-64)\` |"
            done
            echo
            echo "Desktop assets are uploaded by electron-builder from the desktop jobs."
            if [ "${{ needs.ios.result }}" != "success" ]; then
              echo
              echo "> **iOS:** the \`ios\` job finished as \`${{ needs.ios.result }}\` — no IPA attached and nothing went to TestFlight."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
