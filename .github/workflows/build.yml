name: Matou App Build

# when a new tag is pushed, it will run this workflow
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - desktop
          - linux
          - mac-arm64
          - mac-x64
          - windows
          - android
          # WP4 of docs/plans/2026-08-31-github-release-builds-spec.md: build the
          # Capacitor iOS shell — unsigned simulator app, booted and smoke-tested
          # on the runner, plus an unsigned device archive. Dispatch-only until
          # WP5 adds signing + TestFlight and folds it into `all` / tag runs.
          - ios
          # WP3: prove the embedded backend links for iOS (gomobile bind only).
          - ios-spike
      testflight:
        description: 'iOS: also upload the signed build to TestFlight (tags always do)'
        required: false
        default: false
        type: boolean

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      # Single source of truth for every platform job (desktop today; android/ios
      # per docs/plans/2026-08-31-github-release-builds-spec.md):
      #   version      = frontend/package.json version, must equal the tag minus 'v'
      #   build_number = MMMmmmppp from the tag (0.4.1 -> 4001), same scheme as the
      #                  Forgejo android.yml versionCode; run_number off a tag.
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}
      desktop: ${{ steps.set-matrix.outputs.desktop }}
      android: ${{ steps.set-matrix.outputs.android }}
      ios_spike: ${{ steps.set-matrix.outputs.ios_spike }}
      ios: ${{ steps.set-matrix.outputs.ios }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - id: version
        name: Derive version and build number
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./frontend/package.json').version")"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG="$GITHUB_REF_NAME"
            if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.]+)?$ ]]; then
              echo "::error::tag '$TAG' is not vX.Y.Z[-suffix]"
              exit 1
            fi
            if [[ "${TAG#v}" != "$VERSION" ]]; then
              echo "::error::tag '$TAG' does not match frontend/package.json version '$VERSION' — release with scripts/release.sh"
              exit 1
            fi
            BUILD_NUMBER=$(( 10#${BASH_REMATCH[1]} * 1000000 + 10#${BASH_REMATCH[2]} * 1000 + 10#${BASH_REMATCH[3]} ))
          else
            BUILD_NUMBER="$GITHUB_RUN_NUMBER"
          fi
          echo "version=$VERSION build_number=$BUILD_NUMBER"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

      - id: set-matrix
        run: |
          ALL='[{"id":"mac-x64","os":"macos-15-intel","platform":"mac","arch":"x64","make_target":"build-darwin-amd64"},{"id":"mac-arm64","os":"macos-latest","platform":"mac","arch":"arm64","make_target":"build-darwin-arm64"},{"id":"linux","os":"ubuntu-latest","platform":"linux","arch":"amd64","make_target":"build-linux-amd64"},{"id":"windows","os":"windows-2022","platform":"windows","arch":"amd64","make_target":"build-windows-amd64"}]'

          PLATFORM="${{ inputs.platform || 'all' }}"
          case "$PLATFORM" in
            all|desktop) FILTERED="$ALL" ;;
            android|ios|ios-spike) FILTERED='[]' ;;
            *)           FILTERED=$(echo "$ALL" | jq -c --arg id "$PLATFORM" '[.[] | select(.id == $id)]') ;;
          esac
          ANDROID=false
          case "$PLATFORM" in all|android) ANDROID=true ;; esac
          IOS_SPIKE=false
          [ "$PLATFORM" = "ios-spike" ] && IOS_SPIKE=true
          IOS=false
          case "$PLATFORM" in all|ios) IOS=true ;; esac
          DESKTOP=true
          [ "$FILTERED" = "[]" ] && DESKTOP=false
          echo "platform=$PLATFORM desktop=$DESKTOP android=$ANDROID ios=$IOS ios_spike=$IOS_SPIKE"
          echo "matrix={\"include\":$FILTERED}" >> "$GITHUB_OUTPUT"
          echo "desktop=$DESKTOP" >> "$GITHUB_OUTPUT"
          echo "android=$ANDROID" >> "$GITHUB_OUTPUT"
          echo "ios_spike=$IOS_SPIKE" >> "$GITHUB_OUTPUT"
          echo "ios=$IOS" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.desktop == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The whole desktop recipe (toolchains, backend build + verify, Electron
      # packaging, smoke test) lives in .github/actions/build-desktop so that
      # matou-collective/coa-builds runs the identical steps against any
      # matou-app ref (#261). Secrets reach the action as env, never as inputs:
      # GH_TOKEN for --publish=always (electron-builder's draft release),
      # CSC_*/APPLE_* for macOS signing + notarization, VITE_SMTP_* for Vite.
      # Publishing is tag-only, like Play and TestFlight: a branch dispatch
      # must never overwrite a release's assets.
      - name: Build ${{ matrix.platform }}-${{ matrix.arch }} installer
        uses: ./.github/actions/build-desktop
        with:
          platform: ${{ matrix.platform }}
          arch: ${{ matrix.arch }}
          make_target: ${{ matrix.make_target }}
          config_url: ${{ secrets.VITE_PROD_CONFIG_URL }}
          vite_env: ${{ secrets.VITE_ENV || 'prod' }}
          publish: ${{ github.ref_type == 'tag' && 'always' || 'never' }}
          sign: ${{ matrix.platform == 'mac' }}
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          VITE_SMTP_HOST: ${{ secrets.VITE_SMTP_HOST }}
          VITE_SMTP_PORT: ${{ secrets.VITE_SMTP_PORT }}

      - name: Upload ${{ matrix.platform }} artifacts
        uses: actions/upload-artifact@v4
        with:
          name: matou-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: frontend/dist/electron/Packaged/**
          if-no-files-found: error

  # Android: signed Play App Bundle + sideload APK (spec WP2). The recipe —
  # setup-toolchain.sh, gomobile .aar (+ 16 KB alignment check), build-aab.sh,
  # verification — is .github/actions/build-android, shared with coa-builds
  # (#261); versionCode/versionName come from `prepare` like every other
  # platform. Signing secrets: docs/SECRETS_CHECKLIST.md "GitHub release
  # secrets". Without them a workflow_dispatch run still builds UNSIGNED smoke
  # artefacts (never uploadable to Play); a tag run fails hard.
  android:
    needs: prepare
    if: needs.prepare.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build release AAB + APK
        id: build
        uses: ./.github/actions/build-android
        with:
          config_url: ${{ secrets.VITE_PROD_CONFIG_URL }}
          version_name: ${{ needs.prepare.outputs.version }}
          version_code: ${{ needs.prepare.outputs.build_number }}
          bundle: "true"
          keystore_b64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          keystore_password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          key_alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          key_password: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # A tagged release must be signed; a dispatch may smoke-build unsigned.
          allow_unsigned: ${{ github.ref_type != 'tag' }}
          # Firebase config for push (#177), base64 of google-services.json.
          # Unset → build-aab.sh builds without push (plugin skipped).
          google_services_json: ${{ secrets.GOOGLE_SERVICES_JSON }}
          artifact_basename: matou-${{ needs.prepare.outputs.version }}

      - name: Upload Android artefacts
        uses: actions/upload-artifact@v4
        with:
          name: matou-${{ needs.prepare.outputs.version }}-android
          path: out/*
          if-no-files-found: error

      # Auto-publish to the Play OPEN testing track (#202). Tag runs only, and
      # last: a Play-side failure must not cost us the artefacts above. The
      # script (bash+openssl+curl+python3, all on ubuntu-latest) does
      # edits.insert -> bundles.upload -> tracks.patch -> edits.commit and
      # deletes the edit on failure. Promotion to production stays human.
      - name: Publish AAB to Play open testing
        if: github.ref_type == 'tag'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_AAB: ${{ steps.build.outputs.aab }}
          MATOU_VERSION_NAME: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${PLAY_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON secret is not set — AAB built but NOT published (docs/mobile/PLAY_STORE.md §6)"
            exit 1
          fi
          if [ "${{ steps.build.outputs.signed }}" != "true" ]; then
            echo "::error::refusing to publish an unsigned bundle"
            exit 1
          fi
          bash scripts/android/play-upload.sh

  # Attach the mobile installers to the draft release that electron-builder
  # creates for the desktop targets (spec WP6, mobile half). Tag runs only; the
  # release stays a draft for a human to publish after checking Play/TestFlight.
  # iOS Phase 0 (spec WP3, Forgejo #29): does the full backend — any-sync,
  # quic-go, modernc sqlite, KERI — link through gomobile for ios + iossimulator?
  # workflow_dispatch(platform=ios-spike) only. Produces Matou.xcframework as an
  # artefact and prints the generated Objective-C header so MobileStart/MobileStop
  # can be eyeballed. Nothing downstream consumes it yet (WP4 vendors it into the
  # Capacitor iOS shell).
  ios-spike:
    needs: prepare
    if: needs.prepare.outputs.ios_spike == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      # Same x/mobile revision as scripts/android/setup-toolchain.sh and go.mod.
      XMOBILE_VERSION: v0.0.0-20260812174124-2f419b2fb945
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          go version

      - name: Install gomobile + gobind (pinned)
        run: |
          set -euo pipefail
          go install "golang.org/x/mobile/cmd/gomobile@$XMOBILE_VERSION"
          go install "golang.org/x/mobile/cmd/gobind@$XMOBILE_VERSION"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/gomobile" init
          "$(go env GOPATH)/bin/gomobile" version

      - name: gomobile bind (ios, iossimulator)
        id: bind
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/Matou.xcframework"
          IOS_XCFRAMEWORK="$OUT" make -C backend build-ios-xcframework
          echo "xcframework=$OUT" >> "$GITHUB_OUTPUT"

      - name: Inspect the xcframework
        run: |
          set -euo pipefail
          OUT="${{ steps.bind.outputs.xcframework }}"
          echo "== bundle layout"
          find "$OUT" -maxdepth 2 | sort
          echo
          echo "== Info.plist (slices)"
          plutil -p "$OUT/Info.plist"
          echo
          # The device slice: ios-arm64/Matou.framework/Matou
          DEVICE_FW="$(find "$OUT" -maxdepth 2 -type d -name 'ios-arm64' | head -1)/Matou.framework"
          SIM_FW="$(find "$OUT" -maxdepth 2 -type d -name 'ios-*simulator' | head -1)/Matou.framework"
          test -f "$DEVICE_FW/Matou" || { echo "::error::device slice missing at $DEVICE_FW"; exit 1; }
          test -f "$SIM_FW/Matou" || { echo "::error::simulator slice missing at $SIM_FW"; exit 1; }
          echo "== lipo -info (device)";    lipo -info "$DEVICE_FW/Matou"
          echo "== lipo -info (simulator)"; lipo -info "$SIM_FW/Matou"
          echo "== otool -L (device)";      otool -L "$DEVICE_FW/Matou" || true
          echo "== vtool -show-build (device)"; xcrun vtool -show-build "$DEVICE_FW/Matou" || true
          echo "== sizes"; du -sh "$DEVICE_FW/Matou" "$SIM_FW/Matou"
          echo
          echo "== generated header (device slice)"
          HDR="$DEVICE_FW/Headers/Mobile.objc.h"
          test -f "$HDR" || { echo "::error::Mobile.objc.h not generated"; find "$DEVICE_FW/Headers"; exit 1; }
          cat "$HDR"
          # Acceptance: the two entry points the Swift plugin will call.
          grep -q 'MobileStart(' "$HDR" || { echo "::error::MobileStart missing from header"; exit 1; }
          grep -q 'MobileStop('  "$HDR" || { echo "::error::MobileStop missing from header"; exit 1; }
          {
            echo "## iOS spike — gomobile bind PASSED"
            echo
            echo '```'
            lipo -info "$DEVICE_FW/Matou"; lipo -info "$SIM_FW/Matou"; du -sh "$DEVICE_FW/Matou" "$SIM_FW/Matou"
            echo '```'
            echo
            echo '<details><summary>Mobile.objc.h</summary>'
            echo; echo '```objc'; cat "$HDR"; echo '```'; echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Zip xcframework
        # ditto keeps the bundle layout (upload-artifact would flatten the top
        # directory); this is also how xcframeworks are normally distributed.
        run: |
          set -euo pipefail
          OUT="${{ steps.bind.outputs.xcframework }}"
          ditto -c -k --keepParent "$OUT" "$RUNNER_TEMP/Matou.xcframework.zip"
          shasum -a 256 "$RUNNER_TEMP/Matou.xcframework.zip" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload xcframework
        uses: actions/upload-artifact@v4
        with:
          name: Matou.xcframework
          path: ${{ runner.temp }}/Matou.xcframework.zip
          if-no-files-found: error
          retention-days: 14

  # iOS app (spec WP4 + WP5): Capacitor shell + Swift plugins around the gomobile
  # backend. Builds the unsigned Simulator app, boots it on the runner and checks
  # the embedded backend comes up (os_log "backend up" + GET /health through the
  # shared loopback), then signs a Release archive, exports an App Store IPA and —
  # on a tag, or on dispatch with testflight=true — uploads it to TestFlight.
  # Without the signing secrets it falls back to an unsigned archive.
  ios:
    needs: prepare
    if: needs.prepare.outputs.ios == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      XMOBILE_VERSION: v0.0.0-20260812174124-2f419b2fb945
      VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            frontend/src-capacitor/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          go version
          pod --version
          df -h /

      - name: Install gomobile + gobind (pinned)
        run: |
          set -euo pipefail
          go install "golang.org/x/mobile/cmd/gomobile@$XMOBILE_VERSION"
          go install "golang.org/x/mobile/cmd/gobind@$XMOBILE_VERSION"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/gomobile" init

      - name: gomobile bind — embedded backend xcframework
        run: make -C backend build-ios-xcframework

      - name: Install frontend dependencies
        run: |
          (cd frontend && npm ci)
          (cd frontend/src-capacitor && npm ci)

      - name: Build Simulator app (unsigned)
        env:
          VITE_PROD_CONFIG_URL: ${{ secrets.VITE_PROD_CONFIG_URL }}
          MATOU_VERSION_CODE: ${{ needs.prepare.outputs.build_number }}
          MATOU_VERSION_NAME: ${{ needs.prepare.outputs.version }}
        run: bash scripts/ios/build-ipa.sh --simulator

      - name: Boot Simulator and smoke-test the embedded backend
        id: smoke
        run: |
          set -euo pipefail
          APP=frontend/dist/capacitor/ios/simulator/Matou.app
          EV="$RUNNER_TEMP/ios-smoke"; mkdir -p "$EV"
          echo "== bundle"
          plutil -p "$APP/Info.plist" | grep -E "CFBundle(Identifier|ShortVersionString|Version)\""
          UDID="$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.isAvailable and (.name | test("^iPhone")))] | last | .udid')"
          test -n "$UDID" && test "$UDID" != null || { echo "::error::no available iPhone simulator"; xcrun simctl list devices; exit 1; }
          echo "== simulator $UDID"; xcrun simctl list devices available | grep "$UDID"
          echo "== bundle contents"; ls "$APP"; cat "$APP/capacitor.config.json"; ls "$APP/public" | head
          file "$APP/public"; test -d "$APP/public" || { echo "::error::public is not a directory in the bundle"; exit 1; }
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          # --console-pty attaches a pty, so Swift `print` (Capacitor's own log
          # lines and the forwarded WebView console) is line-buffered and lands in
          # the file as it happens; plain file redirection block-buffers it.
          xcrun simctl launch --console-pty "$UDID" nz.matou.app > "$EV/console.log" 2>&1 &
          CONSOLE_PID=$!
          echo "== installed container"; CONTAINER="$(xcrun simctl get_app_container "$UDID" nz.matou.app 2>/dev/null || true)"
          [ -n "$CONTAINER" ] && { ls -la "$CONTAINER" | head -20; file "$CONTAINER/public"; }
          oslog() { xcrun simctl spawn "$UDID" log show --style compact --info --last 10m --predicate 'subsystem == "nz.matou.app"' 2>/dev/null || true; }
          PORT=""
          for i in $(seq 1 36); do
            sleep 5
            L="$(oslog)"
            if UP="$(printf '%s\n' "$L" | grep -m1 'backend up on 127.0.0.1:')"; then
              PORT="${UP##*127.0.0.1:}"; PORT="${PORT%%[^0-9]*}"; break
            fi
            if printf '%s\n' "$L" | grep -q 'backend start failed'; then break; fi
          done
          # Give the WebView a moment to render whatever it got, then capture evidence.
          sleep 5
          xcrun simctl io "$UDID" screenshot "$EV/screenshot.png"
          oslog > "$EV/oslog.txt"
          xcrun simctl spawn "$UDID" log show --style compact --last 10m --predicate 'process == "App"' > "$EV/oslog-app-process.txt" 2>/dev/null || true
          echo "== os_log (nz.matou.app)"; tail -40 "$EV/oslog.txt"
          echo "== app console (Capacitor + WebView console + Go stderr, tail)"; tail -80 "$EV/console.log" || true
          if [ -z "$PORT" ]; then
            echo "== os_log (process App, errors/faults)"; grep -E " (E|F) " "$EV/oslog-app-process.txt" | tail -40 || true
            echo "::error::embedded backend did not report 'backend up' within 3 minutes — see the ios-smoke artefact"
            exit 1
          fi
          echo "== backend port $PORT — GET /health from the runner (simulator shares the host loopback)"
          curl -sS --max-time 15 "http://127.0.0.1:$PORT/health" | tee "$EV/health.json"; echo
          # The Swift plugins must work, not merely load: the backend comes up even
          # when the Keychain rejects every call, so assert on the app console too.
          if grep -q "SecureStorage: .* failed" "$EV/console.log"; then
            echo "::error::SecureStorage plugin failed at runtime — see the ios-smoke artefact"
            grep -m3 "SecureStorage: .* failed" "$EV/console.log"
            exit 1
          fi
          # Proves the whole WebView -> loopback backend -> config server chain, which
          # is how a Capacitor build sources its client config (issue #99).
          if ! grep -q "Client config loaded" "$EV/console.log"; then
            echo "::error::the WebView never loaded its client config through the embedded backend"
            exit 1
          fi
          # Expected before an org exists: the backend serves org config from its own
          # cache only (it mirrors to the config server, never fetches from it), and a
          # WebView cannot fetch the plain-http config server directly on EITHER mobile
          # platform — capacitor:// and https://localhost are secure origins, so that
          # request is mixed content, and Android additionally permits cleartext to
          # loopback only. Same screen on Android; tracked as an app-level follow-up,
          # not an iOS shell problem.
          if grep -q "All servers unreachable" "$EV/console.log"; then
            echo "::notice::org config unavailable (no org configured yet) — expected on a fresh install, matches Android"
          fi
          {
            echo "## iOS Simulator smoke — backend up on 127.0.0.1:$PORT"
            echo; echo '```'; cat "$EV/health.json"; echo; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          xcrun simctl terminate "$UDID" nz.matou.app || true
          kill "$CONSOLE_PID" 2>/dev/null || true

      - name: Upload smoke evidence (screenshot, logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-smoke
          path: ${{ runner.temp }}/ios-smoke
          if-no-files-found: ignore
          retention-days: 14

      - name: Zip Simulator app
        run: |
          set -euo pipefail
          ditto -c -k --keepParent frontend/dist/capacitor/ios/simulator/Matou.app "$RUNNER_TEMP/Matou-simulator.app.zip"
          shasum -a 256 "$RUNNER_TEMP/Matou-simulator.app.zip" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload Simulator app
        uses: actions/upload-artifact@v4
        with:
          name: matou-${{ needs.prepare.outputs.version }}-ios-simulator
          path: ${{ runner.temp }}/Matou-simulator.app.zip
          if-no-files-found: error
          retention-days: 14

      # The Debug Simulator build's DerivedData plus the Go and gomobile caches fill
      # the runner: the Release archive died mid-rsync with "Input/output error"
      # writing Capacitor.framework (run 33463417761). Everything below is either
      # already uploaded or rebuilt from scratch by the archive, and nothing after
      # this point needs Go — only the xcframework, which is kept.
      - name: Reclaim disk space before the archive
        run: |
          set -euo pipefail
          df -h /
          xcrun simctl shutdown all || true
          xcrun simctl delete unavailable || true
          rm -rf frontend/dist/capacitor/ios/DerivedData frontend/dist/capacitor/ios/simulator
          go clean -cache -testcache || true
          go clean -modcache || true
          df -h /

      # Certificate into a throwaway keychain, profile into both directories Xcode
      # looks in (16 moved it). Team id and profile name are read back out of the
      # profile itself rather than trusted from a secret, so a mismatched trio
      # fails here with a clear message instead of deep inside xcodebuild.
      - name: Import signing assets
        id: signing
        env:
          APPLE_IOS_CERT_B64: ${{ secrets.APPLE_IOS_CERT_B64 }}
          APPLE_IOS_CERT_PASSWORD: ${{ secrets.APPLE_IOS_CERT_PASSWORD }}
          APPLE_IOS_PROFILE_B64: ${{ secrets.APPLE_IOS_PROFILE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "$APPLE_IOS_CERT_B64" ] || [ -z "$APPLE_IOS_PROFILE_B64" ]; then
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              echo "::error::iOS signing secrets are not set — a tagged release must be signed (docs/SECRETS_CHECKLIST.md)"
              exit 1
            fi
            echo "::warning::iOS signing secrets not set — falling back to an unsigned archive"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/matou-signing.keychain-db"
          KEYCHAIN_PW="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"   # don't relock mid-build
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          # Prepend ours, keeping the login/System keychains searchable so Apple's
          # WWDR intermediate still resolves.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')
          umask 077
          printf '%s' "$APPLE_IOS_CERT_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$APPLE_IOS_CERT_PASSWORD" \
            -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          # Without this codesign blocks on a GUI prompt for the private key.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          echo "== code-signing identities"
          security find-identity -v -p codesigning "$KEYCHAIN"

          PROFILE="$RUNNER_TEMP/matou.mobileprovision"
          printf '%s' "$APPLE_IOS_PROFILE_B64" | base64 --decode > "$PROFILE"
          PLIST="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$PROFILE" > "$PLIST"
          UUID="$(plutil -extract UUID raw -o - "$PLIST")"
          TEAM="$(plutil -extract TeamIdentifier.0 raw -o - "$PLIST")"
          NAME="$(plutil -extract Name raw -o - "$PLIST")"
          APPID="$(plutil -extract Entitlements.application-identifier raw -o - "$PLIST")"
          echo "profile '$NAME' uuid=$UUID team=$TEAM application-identifier=$APPID"
          if [ "$APPID" != "$TEAM.nz.matou.app" ]; then
            echo "::error::profile is for $APPID, expected $TEAM.nz.matou.app"
            exit 1
          fi
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                   "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d"; cp "$PROFILE" "$d/$UUID.mobileprovision"
          done
          {
            echo "signed=true"
            echo "team_id=$TEAM"
            echo "profile_name=$NAME"
          } >> "$GITHUB_OUTPUT"

      - name: Signed Release archive + App Store IPA
        if: steps.signing.outputs.signed == 'true'
        env:
          VITE_PROD_CONFIG_URL: ${{ secrets.VITE_PROD_CONFIG_URL }}
          MATOU_VERSION_CODE: ${{ needs.prepare.outputs.build_number }}
          MATOU_VERSION_NAME: ${{ needs.prepare.outputs.version }}
          MATOU_IOS_TEAM_ID: ${{ steps.signing.outputs.team_id }}
          MATOU_IOS_PROFILE_NAME: ${{ steps.signing.outputs.profile_name }}
        run: |
          set -euo pipefail
          bash scripts/ios/build-ipa.sh
          IPA="frontend/dist/capacitor/ios/ipa/matou-${VERSION}-ios.ipa"
          APP=frontend/dist/capacitor/ios/archive/Matou.xcarchive/Products/Applications/App.app
          echo "== archive app"
          plutil -p "$APP/Info.plist" | grep -E "CFBundle(Identifier|ShortVersionString|Version)\"|MinimumOSVersion"
          lipo -info "$APP/App"
          test -f "$APP/PrivacyInfo.xcprivacy" && echo "PrivacyInfo.xcprivacy present"
          echo "== signature"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | grep -E "Authority|TeamIdentifier|Identifier=" || true
          echo "== embedded entitlements"
          codesign -d --entitlements - --xml "$APP" 2>/dev/null | plutil -p - || true
          test -f "$IPA" || { echo "::error::no IPA at $IPA"; exit 1; }
          echo "== ipa"; ls -lh "$IPA"
          {
            echo "## iOS — signed App Store IPA"
            echo
            echo '```'
            codesign -dv --verbose=2 "$APP" 2>&1 | grep -E "Authority|TeamIdentifier|Identifier=" || true
            shasum -a 256 "$IPA"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload IPA artefact
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: matou-${{ needs.prepare.outputs.version }}-ios
          path: frontend/dist/capacitor/ios/ipa/matou-${{ needs.prepare.outputs.version }}-ios.ipa
          if-no-files-found: error
          retention-days: 14

      # Publishing step: a tag always uploads; a dispatch only when explicitly
      # asked, so nobody pushes a build to real testers by running the job.
      - name: Upload to TestFlight
        if: steps.signing.outputs.signed == 'true' && (github.ref_type == 'tag' || inputs.testflight)
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          set -euo pipefail
          if [ -z "$APPLE_API_KEY_ID" ] || [ -z "$APPLE_API_ISSUER" ] || [ -z "$APPLE_API_KEY_CONTENT" ]; then
            echo "::error::App Store Connect API secrets missing — cannot upload to TestFlight"
            exit 1
          fi
          # altool looks for the key by convention; it must not be world-readable.
          umask 077
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s\n' "$APPLE_API_KEY_CONTENT" > "$HOME/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          IPA="frontend/dist/capacitor/ios/ipa/matou-${VERSION}-ios.ipa"
          echo "== validate"
          xcrun altool --validate-app -f "$IPA" -t ios \
            --apiKey "$APPLE_API_KEY_ID" --apiIssuer "$APPLE_API_ISSUER"
          echo "== upload"
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$APPLE_API_KEY_ID" --apiIssuer "$APPLE_API_ISSUER"
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          echo "::notice::uploaded $VERSION ($BUILD_NUMBER) to TestFlight — processing takes a few minutes before it appears"
          echo "### iOS $VERSION ($BUILD_NUMBER) uploaded to TestFlight" >> "$GITHUB_STEP_SUMMARY"

      - name: Unsigned Release device archive (no signing secrets)
        if: steps.signing.outputs.signed != 'true'
        env:
          VITE_PROD_CONFIG_URL: ${{ secrets.VITE_PROD_CONFIG_URL }}
          MATOU_VERSION_CODE: ${{ needs.prepare.outputs.build_number }}
          MATOU_VERSION_NAME: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          bash scripts/ios/build-ipa.sh --unsigned-archive
          APP=frontend/dist/capacitor/ios/archive/Matou.xcarchive/Products/Applications/App.app
          echo "== archive app"; plutil -p "$APP/Info.plist" | grep -E "CFBundle(Identifier|ShortVersionString|Version)\"|MinimumOSVersion"
          lipo -info "$APP/App"
          test -f "$APP/PrivacyInfo.xcprivacy" && echo "PrivacyInfo.xcprivacy present"

      - name: Tear down the signing keychain
        if: always() && steps.signing.outputs.signed == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/matou-signing.keychain-db" 2>/dev/null || true
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision \
                "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/"*.mobileprovision 2>/dev/null || true

  release:
    # `ios` is in needs so its artefact can be attached, but the release is NOT
    # gated on it: Android is the shipping mobile platform, and a flaky iOS run
    # must not withhold the Mac/Linux/Windows/Android assets. A failed iOS job
    # is called out in the summary instead.
    needs: [prepare, build, android, ios]
    if: always() && github.ref_type == 'tag' && needs.android.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Download Android artefacts
        uses: actions/download-artifact@v4
        with:
          name: matou-${{ needs.prepare.outputs.version }}-android
          path: out

      - name: Download iOS IPA
        if: needs.ios.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: matou-${{ needs.prepare.outputs.version }}-ios
          path: out

      - name: Attach to the draft release
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Desktop jobs normally create the draft; if they all failed, make it ourselves.
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" out/* --repo "$GITHUB_REPOSITORY" --clobber
          {
            echo "### $TAG — mobile installers attached to the draft release"
            echo
            echo "| file | size | sha256 |"
            echo "| --- | --- | --- |"
            for f in out/*; do
              echo "| $(basename "$f") | $(du -h "$f" | cut -f1) | \`$(sha256sum "$f" | cut -c1-64)\` |"
            done
            echo
            echo "Desktop assets are uploaded by electron-builder from the desktop jobs."
            if [ "${{ needs.ios.result }}" != "success" ]; then
              echo
              echo "> **iOS:** the \`ios\` job finished as \`${{ needs.ios.result }}\` — no IPA attached and nothing went to TestFlight."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
