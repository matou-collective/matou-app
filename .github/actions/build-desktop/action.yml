# build-desktop — build one desktop installer (DMG / AppImage / NSIS) from a
# matou-app checkout: toolchains, frontend deps, Go backend for the target,
# binary verification, optional COA kit, Electron packaging, and a packaging
# smoke test. Shared by this repo's release workflow (build.yml) and by
# matou-collective/coa-builds, which checks matou-app out at MATOU_APP_REF and
# calls `uses: ./.github/actions/build-desktop` (#261).
#
# Secrets never enter this action as inputs. Signing / publishing / Vite
# settings that are secret in one consumer and plain in another are read from
# the environment the caller sets on the `uses:` step:
#   GH_TOKEN                          electron-builder publish (publish=always)
#   CSC_LINK, CSC_KEY_PASSWORD        macOS Developer ID certificate (sign=true)
#   APPLE_API_KEY_CONTENT, APPLE_API_KEY_ID, APPLE_API_ISSUER, APPLE_TEAM_ID
#                                     notarization (sign=true)
#   VITE_SMTP_HOST, VITE_SMTP_PORT    optional Vite build-time settings
# The checkout must already exist (the caller decides which ref to build).
name: Build desktop installer
description: Backend + Electron build for one platform/arch, with packaging smoke test

inputs:
  platform:
    description: mac | linux | windows
    required: true
  arch:
    description: Electron arch flag for mac (x64 | arm64); informational elsewhere
    required: true
  make_target:
    description: backend Makefile target (build-darwin-arm64 | build-darwin-amd64 | build-linux-amd64 | build-windows-amd64)
    required: true
  config_url:
    description: VITE_PROD_CONFIG_URL baked into the app
    required: true
  vite_env:
    description: VITE_ENV value
    required: false
    default: prod
  publish:
    description: electron-builder --publish mode (always | never)
    required: false
    default: never
  sign:
    description: "true = macOS code-sign + notarize with the CSC_*/APPLE_* env; false = CSC_IDENTITY_AUTO_DISCOVERY=false"
    required: false
    default: "false"
  kit_dir:
    description: Path to a COA kit directory to apply before building (empty = stock Matou branding)
    required: false
    default: ""
  smoke:
    description: Run the platform packaging smoke test after the build
    required: false
    default: "true"

outputs:
  packaged_dir:
    description: Directory holding the built installer(s)
    value: frontend/dist/electron/Packaged

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: backend/go.mod
        cache-dependency-path: backend/go.sum

    - name: Install frontend dependencies + Quasar CLI
      shell: bash
      run: |
        set -euo pipefail
        cd frontend
        CI=true npm ci
        npm install -g @quasar/cli

    - name: Apply the COA kit
      if: inputs.kit_dir != ''
      shell: bash
      run: |
        set -euo pipefail
        # The kit path is relative to the workspace, but apply-kit runs from frontend/.
        case "$KIT_DIR" in /*) ;; *) KIT_DIR="$GITHUB_WORKSPACE/$KIT_DIR" ;; esac
        cd frontend
        # icons.mjs arrived with kit plan Task 2 (#238); older refs apply tokens/ids only.
        if [ -f scripts/kit/icons.mjs ]; then npm run kit:apply -- "$KIT_DIR"
        else npm run kit:apply -- "$KIT_DIR" --no-icons; fi
      env:
        KIT_DIR: ${{ inputs.kit_dir }}

    - name: Build backend
      shell: bash
      run: |
        set -euo pipefail
        cd backend
        go mod tidy
        make "$MAKE_TARGET"
      env:
        MAKE_TARGET: ${{ inputs.make_target }}

    - name: Verify backend binary
      shell: bash
      run: |
        set -euo pipefail
        cd backend
        case "$MAKE_TARGET" in
          build-darwin-arm64)  BIN="bin/darwin-arm64/matou-backend" ;;
          build-darwin-amd64)  BIN="bin/darwin-amd64/matou-backend" ;;
          build-linux-amd64)   BIN="bin/linux-amd64/matou-backend" ;;
          build-windows-amd64) BIN="bin/windows-amd64/matou-backend.exe" ;;
          *) echo "::error::unknown make_target $MAKE_TARGET"; exit 1 ;;
        esac

        # 1. exists
        if [ ! -f "$BIN" ]; then
          echo "::error::Backend binary not found at $BIN"
          exit 1
        fi
        echo "Binary found: $BIN ($(stat --format='%s' "$BIN" 2>/dev/null || stat -f '%z' "$BIN") bytes)"

        # 2. right format for the target
        FILE_INFO=$(file "$BIN")
        echo "File type: $FILE_INFO"
        case "$MAKE_TARGET" in
          build-darwin-arm64)  echo "$FILE_INFO" | grep -qi "Mach-O.*arm64"  || { echo "::error::Expected Mach-O arm64 binary"; exit 1; } ;;
          build-darwin-amd64)  echo "$FILE_INFO" | grep -qi "Mach-O.*x86_64" || { echo "::error::Expected Mach-O x86_64 binary"; exit 1; } ;;
          build-linux-amd64)   echo "$FILE_INFO" | grep -qi "ELF.*x86-64"    || { echo "::error::Expected ELF x86-64 binary"; exit 1; } ;;
          build-windows-amd64) echo "$FILE_INFO" | grep -qi "PE32\+\|x86-64\|Windows" || { echo "::error::Expected PE32+ Windows binary"; exit 1; } ;;
        esac
        echo "Binary format verified"

        # 3. on a native platform, run it briefly — it prints its banner then
        #    exits on missing config; we only need proof it executes.
        if [ "$PLATFORM" != "windows" ]; then
          chmod +x "$BIN"
          ./"$BIN" > "$RUNNER_TEMP/backend-output.txt" 2>&1 &
          BIN_PID=$!
          sleep 5
          kill $BIN_PID 2>/dev/null || true
          wait $BIN_PID 2>/dev/null || true
          if grep -q "MATOU DAO Backend Server" "$RUNNER_TEMP/backend-output.txt"; then
            echo "Binary executes correctly (startup banner detected)"
          else
            echo "::error::Binary did not produce expected startup banner"
            cat "$RUNNER_TEMP/backend-output.txt"
            exit 1
          fi
        else
          echo "Skipping execution test on Windows (cross-platform binary check only)"
        fi
      env:
        MAKE_TARGET: ${{ inputs.make_target }}
        PLATFORM: ${{ inputs.platform }}

    - name: Set up macOS signing
      if: inputs.platform == 'mac' && inputs.sign == 'true'
      shell: bash
      run: |
        # The App Store Connect API key lives outside the checkout so it can
        # never land in an artefact; the build step points APPLE_API_KEY at it.
        set -euo pipefail
        [ -n "${APPLE_API_KEY_CONTENT:-}" ] || { echo "::error::sign=true but APPLE_API_KEY_CONTENT is not set in the environment"; exit 1; }
        umask 077
        printf '%s\n' "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/AuthKey.p8"

    - name: Build Electron app
      shell: bash
      run: |
        set -euo pipefail
        cd frontend
        if [ "$SIGN" = "true" ]; then
          export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
        else
          # No certificate: stop electron-builder looking for one in the keychain.
          export CSC_IDENTITY_AUTO_DISCOVERY=false
          unset CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_TEAM_ID
        fi
        if [ "$PLATFORM" = "mac" ]; then
          npx quasar build -m electron --mac "--$ARCH" "--publish=$PUBLISH"
        else
          npx quasar build -m electron "--publish=$PUBLISH"
        fi
        ls -la dist/electron/Packaged
      env:
        PLATFORM: ${{ inputs.platform }}
        ARCH: ${{ inputs.arch }}
        PUBLISH: ${{ inputs.publish }}
        SIGN: ${{ inputs.sign }}
        VITE_PROD_CONFIG_URL: ${{ inputs.config_url }}
        VITE_ENV: ${{ inputs.vite_env }}

    - name: Smoke test — AppImage packaging (Linux)
      if: inputs.smoke == 'true' && inputs.platform == 'linux'
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update -qq && sudo apt-get install -y -qq xvfb >/dev/null

        APPIMAGE=$(find frontend/dist/electron/Packaged -maxdepth 1 -name '*.AppImage' | head -1)
        if [ -z "$APPIMAGE" ]; then
          echo "::error::No AppImage found in build output"
          exit 1
        fi
        echo "Found AppImage: $APPIMAGE"
        chmod +x "$APPIMAGE"

        # Extract (no FUSE on CI runners) to inspect the payload.
        "$APPIMAGE" --appimage-extract > /dev/null 2>&1
        echo "AppImage extracted to squashfs-root/"

        # afterPack.cjs wraps the (product-named) executable to pass --no-sandbox.
        if grep -l "no-sandbox" squashfs-root/* 2>/dev/null | xargs -r file | grep -q "shell script"; then
          echo "Sandbox wrapper script verified"
        else
          echo "::warning::No --no-sandbox wrapper found at the AppImage root"
        fi

        # The backend must be bundled at the path electron-main expects.
        BACKEND_BIN="squashfs-root/resources/backend/linux-amd64/matou-backend"
        if [ ! -f "$BACKEND_BIN" ]; then
          echo "::error::Backend binary not found in package at $BACKEND_BIN"
          echo "Contents of resources/backend/:"
          find squashfs-root/resources/backend/ -type f 2>/dev/null || echo "(directory not found)"
          exit 1
        fi
        echo "Backend binary found in package: $BACKEND_BIN"

        chmod +x "$BACKEND_BIN"
        "$BACKEND_BIN" > "$RUNNER_TEMP/pkg-backend-output.txt" 2>&1 &
        PKG_PID=$!
        sleep 5
        kill $PKG_PID 2>/dev/null || true
        wait $PKG_PID 2>/dev/null || true
        if grep -q "MATOU DAO Backend Server" "$RUNNER_TEMP/pkg-backend-output.txt"; then
          echo "Packaged backend binary executes correctly"
        else
          echo "::error::Packaged backend binary did not produce startup banner"
          cat "$RUNNER_TEMP/pkg-backend-output.txt"
          exit 1
        fi
        rm -rf squashfs-root/

        # Launch the whole app briefly. --appimage-extract-and-run sets APPDIR
        # (AppRun needs it) and works for any product name, kit or stock.
        xvfb-run --auto-servernum "$APPIMAGE" --appimage-extract-and-run --no-sandbox > "$RUNNER_TEMP/app-smoke.log" 2>&1 &
        APP_PID=$!
        sleep 10
        if kill -0 $APP_PID 2>/dev/null; then
          echo "Electron app process is running after 10s (PID $APP_PID)"
          kill $APP_PID 2>/dev/null || true
          wait $APP_PID 2>/dev/null || true
        else
          echo "::error::Electron app process died within 10s"
          cat "$RUNNER_TEMP/app-smoke.log"
          exit 1
        fi

    - name: Smoke test — DMG packaging (macOS)
      if: inputs.smoke == 'true' && inputs.platform == 'mac'
      shell: bash
      run: |
        set -euo pipefail
        DMG=$(find frontend/dist/electron/Packaged -maxdepth 1 -name '*.dmg' | head -1)
        if [ -z "$DMG" ]; then
          echo "::error::No DMG found in build output"
          exit 1
        fi
        echo "Found DMG: $DMG"

        # Mount; the mount point is the last tab-separated field of the last
        # attach line, whatever the volume is called (kit builds rename it).
        MOUNT=$(hdiutil attach "$DMG" -nobrowse | tail -1 | awk -F'\t' '{print $NF}' | sed 's/^ *//')
        if [ -z "$MOUNT" ] || [ ! -d "$MOUNT" ]; then
          echo "::error::DMG attach did not yield a mount point"
          exit 1
        fi
        echo "DMG mounted at: $MOUNT"
        trap 'hdiutil detach "$MOUNT" -quiet || true' EXIT

        APP_BUNDLE=$(find "$MOUNT" -maxdepth 1 -name '*.app' | head -1)
        if [ -z "$APP_BUNDLE" ]; then
          echo "::error::No .app bundle found in DMG"
          exit 1
        fi
        echo "App bundle: $APP_BUNDLE"

        case "$ARCH" in
          arm64) ARCH_DIR="darwin-arm64" ;;
          x64)   ARCH_DIR="darwin-amd64" ;;
          *) echo "::error::unknown mac arch $ARCH"; exit 1 ;;
        esac

        BACKEND_BIN="$APP_BUNDLE/Contents/Resources/backend/$ARCH_DIR/matou-backend"
        if [ ! -f "$BACKEND_BIN" ]; then
          echo "::error::Backend binary not found in app bundle at $BACKEND_BIN"
          echo "Contents of Resources/backend/:"
          find "$APP_BUNDLE/Contents/Resources/backend/" -type f 2>/dev/null || echo "(directory not found)"
          exit 1
        fi
        echo "Backend binary found in app bundle"

        "$BACKEND_BIN" > "$RUNNER_TEMP/dmg-backend-output.txt" 2>&1 &
        DMG_PID=$!
        sleep 5
        kill $DMG_PID 2>/dev/null || true
        wait $DMG_PID 2>/dev/null || true
        if grep -q "MATOU DAO Backend Server" "$RUNNER_TEMP/dmg-backend-output.txt"; then
          echo "Packaged backend binary executes correctly"
        else
          echo "::error::Packaged backend binary did not produce startup banner"
          cat "$RUNNER_TEMP/dmg-backend-output.txt"
          exit 1
        fi

        if codesign --verify --deep --strict "$APP_BUNDLE" 2>/dev/null; then
          echo "Code signature verified"
        elif [ "$SIGN" = "true" ]; then
          echo "::error::sign=true but the app bundle's code signature does not verify"
          exit 1
        else
          echo "Unsigned build (sign=false) — signature check skipped"
        fi
      env:
        ARCH: ${{ inputs.arch }}
        SIGN: ${{ inputs.sign }}

    - name: Smoke test — NSIS installer (Windows)
      if: inputs.smoke == 'true' && inputs.platform == 'windows'
      shell: pwsh
      run: |
        $exe = Get-ChildItem -Path frontend/dist/electron/Packaged -Filter '*.exe' -Recurse | Select-Object -First 1
        if (-not $exe) {
          Write-Error "No .exe installer found in build output"
          exit 1
        }
        Write-Host "Found installer: $($exe.FullName)"

        $installDir = "$env:TEMP\MatouSmokeTest"
        Write-Host "Installing to: $installDir"
        $proc = Start-Process $exe.FullName -ArgumentList '/S', "/D=$installDir" -Wait -PassThru
        if ($proc.ExitCode -ne 0) {
          Write-Error "Installer exited with code $($proc.ExitCode)"
          exit 1
        }
        if (-not (Test-Path $installDir)) {
          Write-Error "Installation directory not found at $installDir"
          exit 1
        }

        $backendBin = Get-ChildItem -Path "$installDir\resources\backend\windows-amd64" -Filter 'matou-backend.exe' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
        if (-not $backendBin) {
          Write-Error "Backend binary not found in installed app"
          Write-Host "Contents of resources\backend\:"
          Get-ChildItem "$installDir\resources\backend\" -Recurse -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }
          exit 1
        }
        Write-Host "Backend binary found: $($backendBin.FullName)"

        $output = & $backendBin.FullName 2>&1 | Out-String
        if ($output -match "MATOU DAO Backend Server") {
          Write-Host "Packaged backend binary executes correctly"
        } else {
          Write-Error "Packaged backend binary did not produce startup banner"
          Write-Host "Output was: $output"
          exit 1
        }

        # The main executable is <productName>.exe — kit builds rename it, so
        # accept any top-level .exe that is not the uninstaller.
        $mainExe = Get-ChildItem -Path $installDir -Filter '*.exe' -ErrorAction SilentlyContinue |
          Where-Object { $_.Name -notlike 'Uninstall*' } | Select-Object -First 1
        if ($mainExe) {
          Write-Host "Main executable found: $($mainExe.FullName)"
        } else {
          Write-Error "Main application .exe not found in installation"
          exit 1
        }
        exit 0
