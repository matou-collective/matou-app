# prices.conf — operator-maintained public Claude pricing, keyed by model id,
# for the swarm.db spend telemetry's USD estimate (#202). Seed/refresh the
# `prices` table from this file with:
#
#     python3 swarm-db.py price-load prices.conf     # or: .sandcastle/swarm-db.py …
#
# One model per line, whitespace-separated, USD per 1,000,000 tokens per class:
#
#     <model-id>  <input>  <output>  <cache_write>  <cache_read>
#
# `#` comments and blank lines are ignored; a malformed line is skipped. `spend-by
# --usd` (and the fleet-tui Usage tab) LEFT JOIN this table by model, so a model
# with NO row prices at $0 — the estimate UNDER-reports rather than guesses.
#
# These are a DERIVED ESTIMATE from public list pricing, NOT a spend
# authorization and NOT a figure of record — VERIFY against current published
# pricing before trusting the dollar column, and keep the model ids in step with
# swarm.config's SWARM_MODEL / SWARM_MODEL_MAP. cache_write ≈ 1.25× input,
# cache_read ≈ 0.1× input is the usual shape; set the real rates here.
#
# model-id              input   output  cache_write  cache_read
claude-opus-4-8          15.00   75.00   18.75        1.50
claude-opus-5            15.00   75.00   18.75        1.50
claude-sonnet-4-5         3.00   15.00    3.75        0.30
claude-haiku-4-5          1.00    5.00    1.25        0.10
