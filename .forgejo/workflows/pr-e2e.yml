name: pr-e2e
on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to run feature e2e for"
        required: true

jobs:
  feature-e2e:
    # TEMPORARY PIN (healer, 2026-09-15) — revert to `swarm` once #527 lands.
    # #297 flipped this to the pooled `swarm` label so any enrolled host could
    # take the drive. That is correct in principle, but right now only ONE of
    # the two `swarm` runners can actually bootstrap the stack: #527 (the minio
    # org went anonymous-denied on Docker Hub) hard-downs `make setup-test` on
    # any host that does not already have minio/mc + minio/minio cached, and
    # matou-workstation does not. elitebook-03 does (its test stack is up and
    # `make start` never re-pulls a cached image), and provision-e2e-stack.sh
    # --check reports the full stack ready there.
    # Evidence: every pr-e2e task since 04:21Z landed on matou-workstation and
    # died — 19299 at the any-sync infra stage (#527), then 7 runs in a row that
    # died in ~40 s before writing a verdict — while the last green pr-e2e
    # (task 86673) ran on elitebook-03. Pinning restores PR e2e evidence; it
    # does NOT fix #527, and it makes elitebook-03 a single point of failure
    # for this workflow until the pin comes off.
    runs-on: elitebook-03
    # Up to 30 min camped on host capacity (#268) + the drive itself.
    timeout-minutes: 75
    # Every PR: run-pr-e2e.sh resolves the spec from the branch name
    # (agent/issue-<N>) or the PR body's '**Feature e2e:**' marker, and posts a
    # verdict comment on the PR either way.
    steps:
      - name: Feature e2e under global lock
        env:
          FORGEJO_TOKEN: ${{ secrets.SWARM_FORGEJO_TOKEN }}
          FORGEJO_API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          REPO_SLUG: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          MATTERMOST_URL: ${{ secrets.MATTERMOST_URL }}
          MATTERMOST_BOT_TOKEN: ${{ secrets.MATTERMOST_BOT_TOKEN }}
          MATTERMOST_CHANNEL_ID: ${{ secrets.MATTERMOST_CHANNEL_ID }}
        run: |
          set -euo pipefail
          # Full-host exclusivity (#268): the drive's bootstrap is timing-
          # sensitive (keri + any-sync + backend + playwright on the 7 GB
          # workstation) and was starved by heavy co-runners — CI tasks 40576/
          # 41257/41484 each failed while an unlocked checks/build-apk job ran
          # beside it. Holding ONLY slot 1 was never enough: swarm/triage ride
          # slot 2, and checks/android took no slot at all (they now do, via
          # .sandcastle/host-slot-wait.sh). So: declare the drive-wanted
          # reservation (slot claimers stand down, idss #663/#664), then take
          # EVERY pooled slot all-or-nothing. Bounded camp — this job is
          # event-driven; nothing re-fires it. Inline (not host-slot-wait.sh)
          # because it runs before the checkout exists, and the checkout is the
          # PR head, which may predate the helper. Keep the TTL story in step
          # with HOST_CAPACITY_DRIVE_WANTED_TTL (900 s): the reservation is
          # re-touched every poll and removed on every exit path below; a
          # SIGKILL leaves it to age out within 15 min.
          drive_res=/tmp/matou-drive-wanted
          deadline=$(( $(date +%s) + 1800 ))
          acquired=0
          while [ "$(date +%s)" -lt "$deadline" ]; do
            touch "$drive_res"
            exec 9>/tmp/matou-swarm.lock
            if flock -n 9; then
              exec 8>/tmp/matou-host-slot-2.lock
              if flock -n 8; then acquired=1; break; fi
              exec 8>&-
            fi
            exec 9>&-
            sleep 20
          done
          rm -f "$drive_res"
          if [ "$acquired" != 1 ]; then
            echo "pr-e2e: host capacity busy for 30min — giving up; re-run via workflow_dispatch or push again"
            # Loud (#278): say it ON THE PR, not only in the run log + Mattermost,
            # so the missing evidence is visible where the review happens. The
            # comment carries the SAME pr-e2e-meta tag shape as pr-e2e-lib.sh
            # (pr_e2e_meta_tag "$sha" pending) — kept in step by hand because this
            # runs before any checkout exists to source the lib. state=pending is
            # what the pr-e2e-sweep keys on to re-dispatch this head once free;
            # run-pr-e2e.sh later edits this SAME <!-- pr-e2e --> comment in place
            # with the real state=done verdict.
            sha="${HEAD_SHA:-}"
            if [ -z "$sha" ]; then
              sha="$(curl -sf --max-time 30 -H "Authorization: token $FORGEJO_TOKEN" "$FORGEJO_API/pulls/$PR_NUMBER" | jq -r '.head.sha // ""' || true)"
            fi
            if [ -n "$PR_NUMBER" ] && [ -n "$sha" ]; then
              body="$(printf '<!-- pr-e2e -->\n<!-- pr-e2e-meta sha=%s state=pending -->\n⏳ **Feature e2e did not run** for `%s`: host busy for 30 min, will be retried by the sweep (#278). Push again or re-run via workflow_dispatch to force it sooner.' "$sha" "${sha:0:12}")"
              payload="$(jq -n --arg b "$body" '{body:$b}')"
              existing="$(curl -sf --max-time 60 -H "Authorization: token $FORGEJO_TOKEN" "$FORGEJO_API/issues/$PR_NUMBER/comments?limit=100" | jq -r '[.[] | select(.body | contains("<!-- pr-e2e -->"))] | last | .id // empty' || true)"
              if [ -n "$existing" ]; then
                curl -sf --max-time 60 -X PATCH -H "Authorization: token $FORGEJO_TOKEN" -H 'Content-Type: application/json' -d "$payload" "$FORGEJO_API/issues/comments/$existing" >/dev/null || true
              else
                curl -sf --max-time 60 -X POST -H "Authorization: token $FORGEJO_TOKEN" -H 'Content-Type: application/json' -d "$payload" "$FORGEJO_API/issues/$PR_NUMBER/comments" >/dev/null || true
              fi
            fi
            # Expected contention, not a harness fault: marker tells the healer
            # step below to stand down instead of spending a claude call (d925814).
            touch "/tmp/matou-pr-e2e-lockbusy.${{ github.run_number }}" || true
            # #566: mark the head PENDING, then exit 0. The run used to `exit 1`,
            # which suppressed only the in-run healer — the HOURLY WATCHDOG reads
            # the run list, saw two failed pr-e2e runs in its window and minted an
            # always-red incident, spending a claude call on the designed give-up
            # path. A deferral is not a failure, so the run no longer claims to be
            # one. Pending, never green: the head's COMBINED status stays
            # unresolved, so "no evidence yet" cannot read as "e2e passed", and
            # the <!-- pr-e2e --> comment above remains the sweep's source of
            # truth. run-pr-e2e.sh resolves this context on the real run.
            if [ -n "$sha" ]; then
              curl -sf --max-time 30 -X POST -H "Authorization: token $FORGEJO_TOKEN" \
                -H 'Content-Type: application/json' \
                -d "$(jq -n --arg url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}" \
                      '{state:"pending", context:"pr-e2e / capacity-deferred", target_url:$url,
                        description:"host busy for 30 min — the pr-e2e sweep will re-run this head"}')" \
                "$FORGEJO_API/statuses/$sha" >/dev/null || true
            fi
            if [ -n "${MATTERMOST_BOT_TOKEN:-}" ]; then
              jq -n --arg channel_id "$MATTERMOST_CHANNEL_ID" \
                --arg message ":hourglass: pr-e2e deferred for \`${{ github.repository }}\` — the host capacity pool was busy for 30min, so the feature spec never ran. The sweep re-runs it; push again or re-run via workflow_dispatch to force it sooner. ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}" \
                '{channel_id: $channel_id, message: $message, props: {remove_link_preview: "true"}}' |
                curl -sf -X POST -H "Authorization: Bearer $MATTERMOST_BOT_TOKEN" -H 'Content-Type: application/json' -d @- "$MATTERMOST_URL/api/v4/posts" >/dev/null || true
            fi
            exit 0
          fi
          workdir="$HOME/swarm-e2e/$REPO_SLUG"
          mkdir -p "$workdir"
          cd "$workdir"
          url="https://swarm:${FORGEJO_TOKEN}@git.matou.nz/${REPO_SLUG}.git"
          if [ -d .git ]; then
            git remote set-url origin "$url"
          else
            git clone "$url" .
          fi
          git fetch origin "refs/pull/${PR_NUMBER}/head"
          git checkout -f FETCH_HEAD
          bash .sandcastle/run-pr-e2e.sh
      - name: Resolve the capacity-deferred marker when the spec actually ran (#566)
        # always(): a head that was deferred earlier and whose spec now RUNS —
        # pass or fail — must stop carrying the pending marker, or its combined
        # status would sit unresolved forever. The give-up path leaves the
        # lockbusy marker for this run number; its presence means the spec never
        # ran, so the pending status stays and the sweep re-dispatches. The e2e
        # verdict itself lives in the <!-- pr-e2e --> comment, never here.
        if: always()
        env:
          FORGEJO_TOKEN: ${{ secrets.SWARM_FORGEJO_TOKEN }}
          FORGEJO_API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}
        run: |
          set -uo pipefail
          # Consume the marker here: on the deferral path the job SUCCEEDS, so the
          # healer step below (if: failure()) never runs and never cleans it up.
          marker="/tmp/matou-pr-e2e-lockbusy.${{ github.run_number }}"
          if [ -f "$marker" ]; then rm -f "$marker"; exit 0; fi
          [ -n "${HEAD_SHA:-}" ] || exit 0
          curl -sf --max-time 30 -X POST -H "Authorization: token $FORGEJO_TOKEN" \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg url "$RUN_URL" \
                  '{state:"success", context:"pr-e2e / capacity-deferred", target_url:$url,
                    description:"the feature spec ran on this head"}')" \
            "$FORGEJO_API/statuses/$HEAD_SHA" >/dev/null || true
      - name: Investigate failure (healer)
        if: failure()
        env:
          FORGEJO_TOKEN: ${{ secrets.SWARM_FORGEJO_TOKEN }}
          FORGEJO_API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN_B: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_B }}
          MATTERMOST_URL: ${{ secrets.MATTERMOST_URL }}
          MATTERMOST_BOT_TOKEN: ${{ secrets.MATTERMOST_BOT_TOKEN }}
          MATTERMOST_CHANNEL_ID: ${{ secrets.MATTERMOST_CHANNEL_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}
          WORKFLOW: pr-e2e
          # HEAL_DRY_RUN deliberately NOT set (Ben's ruling 2026-08-21, first applied
          # in Matou/idss): the healer files tickets and makes its ONE bounded
          # harness-infra repair for real. Set HEAL_DRY_RUN: "1" to return to
          # diagnose-only.
        run: |
          # Stand down on the expected-contention path (see the lock comment
          # above): a lost host lock says nothing about this repo's harness, and
          # investigating it burns a claude call plus a Mattermost page every
          # time a PR lands during a long swarm worker.
          marker="/tmp/matou-pr-e2e-lockbusy.${{ github.run_number }}"
          if [ -f "$marker" ]; then
            rm -f "$marker"
            echo "pr-e2e: lost /tmp/matou-swarm.lock to a concurrent swarm worker — expected contention, not a fault; healer stands down."
            if [ -n "$MATTERMOST_BOT_TOKEN" ]; then
              jq -n --arg channel_id "$MATTERMOST_CHANNEL_ID" \
                --arg message ":hourglass: pr-e2e skipped for \`${{ github.repository }}\` — the host swarm lock was busy for 30min, so the feature spec never ran. Re-run via workflow_dispatch or push again. $RUN_URL" \
                '{channel_id: $channel_id, message: $message, props: {remove_link_preview: "true"}}' |
                curl -sf -X POST -H "Authorization: Bearer $MATTERMOST_BOT_TOKEN" -H 'Content-Type: application/json' -d @- "$MATTERMOST_URL/api/v4/posts" >/dev/null || true
            fi
            exit 0
          fi
          bash "$HOME/swarm-e2e/${{ github.repository }}/.sandcastle/heal.sh" || {
            [ -z "$MATTERMOST_BOT_TOKEN" ] && exit 0
            jq -n --arg channel_id "$MATTERMOST_CHANNEL_ID" --arg message ":rotating_light: pr-e2e failed AND the healer errored in \`${{ github.repository }}\` — $RUN_URL" '{channel_id: $channel_id, message: $message, props: {remove_link_preview: "true"}}' |
              curl -sf -X POST -H "Authorization: Bearer $MATTERMOST_BOT_TOKEN" -H 'Content-Type: application/json' -d @- "$MATTERMOST_URL/api/v4/posts" || true
          }
