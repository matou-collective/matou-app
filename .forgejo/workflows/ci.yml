name: ci
# Forgejo has been observed to silently stop firing a repo's schedule/push
# events; pushing this file re-registers it (see triage.yml's note) — if seam
# runs stop appearing after pushes, touch this file and push again.
on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit to check (ci-sweep passes the sha it is re-running; empty = this ref's head)"
        required: false
        default: ""

# Workflow-level concurrency group keyed on the ref (#361). Without this, a
# release train that lands several commits on main in a short window (four
# pushes in seven minutes was observed) had Forgejo cancel the in-flight/queued
# run of each superseded commit as the next push arrived — and a cancelled run
# is recorded as `failure` on that commit's status, so a commit that is merged
# and immediately followed by another merge never gets a green. PR reviewers and
# the healer then chase phantom red on main.
# Forgejo Actions honours workflow-level concurrency and, with
# cancel-in-progress false, QUEUES every superseded run and executes them
# strictly in sequence — nothing is cancelled, nothing is dropped (verified live
# on Forgejo v15.0.5, see swarm.yml/#38). Declaring the explicit group also
# suppresses the implicit cancel-previous-on-push. Keying on github.ref keeps
# each PR (refs/pull/N/merge) and main (refs/heads/main) in its own lane, so a
# PR burst never blocks a main run and vice versa.
# cancel-in-progress MUST stay false — the whole point is that no superseded run
# is cancelled-and-recorded-as-failure.
# NOTE: this does not fix the slot-starvation half (#285) — a surviving run can
# still camp host-slot-wait.sh and time out under swarm load; that is tracked
# separately and out of scope here.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: swarm
    # Up to 2 × 30 min camped on a host-capacity slot (#268) + the checks.
    timeout-minutes: 105
    env:
      # Give the checks container a stable identity so a cancelled/killed run
      # (docker CLIENT dies, --rm never fires — #331) can be reaped by name and
      # by label. run_id+run_attempt is unique per run and identical across the
      # run step and the always() reap below (run_attempt may resolve empty on
      # this Forgejo — the name stays valid and run_id alone is unique per run).
      CI_CONTAINER: ci-${{ github.run_id }}-${{ github.run_attempt }}
      CI_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Checkout (raw clone — actions/checkout depends on data.forgejo.org action fetch, which fast-fails intermittently, d18d869)
        env:
          FORGEJO_TOKEN: ${{ secrets.SWARM_FORGEJO_TOKEN }}
          SERVER_URL: ${{ github.server_url }}
          REPO_SLUG: ${{ github.repository }}
          SHA: ${{ inputs.sha || github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          host="${SERVER_URL#https://}"
          url="https://swarm:${FORGEJO_TOKEN}@${host}/${REPO_SLUG}.git"
          git init -q .
          git remote add origin "$url" 2>/dev/null || git remote set-url origin "$url"
          git fetch -q --depth=1 origin "$SHA"
          git checkout -q -f FETCH_HEAD
      - name: Frontend + backend checks in the sandbox image
        # Body lives in .sandcastle/run-ci-checks.sh so the run can be wrapped in
        # the on-failure verdict seam: the healer maps `ci` to
        # /tmp/matou-<repo-tag>-seam-verdict.txt, nothing here ever wrote it, and
        # every red ci therefore reached the healer as a workflow-name-only
        # signature with "Trigger error line: unknown" (run 13398).
        #
        # Say "the healer", never that script's bare basename, in THIS step:
        # the park-token-wiring guard (park-wiring-lib.sh, #85) matches its
        # park-capable entry-point basenames against a step's WHOLE block,
        # comments included, and reds the swarm preflight CLOSED if the naming
        # step lacks CLAUDE_CODE_OAUTH_TOKEN_B. Prose alone did exactly that
        # (swarm run 13413). This step spawns no agent and cannot park; the
        # park-capable step is the healer one below, which carries the standby
        # token. Same rule for the other entry points in that guard's list.
        id: checks
        env:
          REPO_SLUG: ${{ github.repository }}
        # Exit 75 (EX_TEMPFAIL) means a heavy stage never STARTED: host-slot-wait
        # camped its whole budget and the pooled slot never came free, because an
        # exclusive drive held the host (#548). That is contention, not a fault —
        # failing here red main, woke the healer on a non-fault, and told a
        # reviewer nothing about the code. Record it as deferred and let the step
        # succeed; the ci-sweep re-runs the sha. Every other non-zero exit is a
        # real failure and still reds, healer and all.
        run: |
          set -uo pipefail
          rc=0
          bash .sandcastle/run-ci-checks.sh || rc=$?
          if [ "$rc" = 75 ]; then
            echo "deferred=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit "$rc"
      - name: Mark the sha deferred, not passed (capacity, #548)
        if: steps.checks.outputs.deferred == '1'
        env:
          FORGEJO_TOKEN: ${{ secrets.SWARM_FORGEJO_TOKEN }}
          FORGEJO_API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          SHA: ${{ inputs.sha || github.event.pull_request.head.sha || github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}
        # PENDING, never success: the job itself exits green so main is not red,
        # but the sha's COMBINED status stays unresolved, so a deferred run can
        # never be mistaken for a passing seam. ci-sweep.sh keys on exactly this
        # context, and a later real run resolves it.
        run: |
          set -euo pipefail
          curl -sf -X POST -H "Authorization: token $FORGEJO_TOKEN" \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg url "$RUN_URL" \
                  '{state:"pending", context:"ci / capacity-deferred", target_url:$url,
                    description:"host capacity held by another job for the whole camp — the ci sweep will re-run this sha"}')" \
            "$FORGEJO_API/statuses/$SHA" >/dev/null
          echo "ci: ${SHA:0:12} marked 'ci / capacity-deferred' pending — the sweep re-runs it"
      - name: Clear a previous capacity deferral on this sha
        # always(): a sha that was deferred earlier and now genuinely FAILS must
        # still have its marker resolved, or the sweep would re-dispatch it every
        # tick forever. The job's own red carries the verdict; this context only
        # ever answers "did the checks get to run".
        if: always() && steps.checks.outputs.deferred != '1'
        env:
          FORGEJO_TOKEN: ${{ secrets.SWARM_FORGEJO_TOKEN }}
          FORGEJO_API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          SHA: ${{ inputs.sha || github.event.pull_request.head.sha || github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}
        # The checks actually RAN this time (pass or fail — the job's own status
        # carries that verdict). Resolve the pending marker so the sha stops
        # being owed a run and the sweep retires it; best-effort, a failure here
        # must never turn a real result into a red.
        run: |
          set -uo pipefail
          curl -sf -X POST -H "Authorization: token $FORGEJO_TOKEN" \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg url "$RUN_URL" \
                  '{state:"success", context:"ci / capacity-deferred", target_url:$url,
                    description:"checks ran on this sha"}')" \
            "$FORGEJO_API/statuses/$SHA" >/dev/null || true
      - name: Investigate failure (healer)
        if: failure()
        env:
          FORGEJO_TOKEN: ${{ secrets.SWARM_FORGEJO_TOKEN }}
          FORGEJO_API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN_B: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_B }}
          MATTERMOST_URL: ${{ secrets.MATTERMOST_URL }}
          MATTERMOST_BOT_TOKEN: ${{ secrets.MATTERMOST_BOT_TOKEN }}
          MATTERMOST_CHANNEL_ID: ${{ secrets.MATTERMOST_CHANNEL_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}
          WORKFLOW: ci
          # HEAL_DRY_RUN deliberately NOT set (Ben's ruling 2026-08-21, first applied
          # in Matou/idss): the healer files tickets and makes its ONE bounded
          # harness-infra repair for real. Set HEAL_DRY_RUN: "1" to return to
          # diagnose-only.
        run: |
          bash .sandcastle/heal.sh || {
            [ -z "$MATTERMOST_BOT_TOKEN" ] && exit 0
            jq -n --arg channel_id "$MATTERMOST_CHANNEL_ID" --arg message ":rotating_light: ci failed AND the healer errored in \`${{ github.repository }}\` — $RUN_URL" '{channel_id: $channel_id, message: $message, props: {remove_link_preview: "true"}}' |
              curl -sf -X POST -H "Authorization: Bearer $MATTERMOST_BOT_TOKEN" -H 'Content-Type: application/json' -d @- "$MATTERMOST_URL/api/v4/posts" || true
          }
      - name: Reap the checks container (belt — dev-factory#122's label sweep is the braces)
        # Belt for a clean cancel/failure where --rm did not fire. Whether
        # forgejo-runner runs always()-steps after a cancel is unconfirmed
        # (#331), so this cannot be the only line of defence — the label sweep
        # covers the cancel-kills-the-runner case this step can't reach.
        if: always()
        run: docker rm -f "$CI_CONTAINER" >/dev/null 2>&1 || true
