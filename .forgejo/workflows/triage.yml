name: triage
on:
  issues:
    types: [opened, reopened]
  # Forgejo re-registers a repo's schedules when workflow files are pushed to
  # the default branch, so pushing this file re-registers the schedule. If
  # the crons stop firing, that registration is the first thing to check —
  # confirm a :05/:35 run appears within 30 minutes of a workflow push.
  schedule:
    - cron: "5,35 * * * *"
  workflow_dispatch: {}

jobs:
  triage:
    runs-on: matou-workstation
    timeout-minutes: 60
    steps:
      - name: Triage under global lock
        env:
          FORGEJO_TOKEN: ${{ secrets.SWARM_FORGEJO_TOKEN }}
          FORGEJO_API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          REPO_SLUG: ${{ github.repository }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          MATTERMOST_URL: ${{ secrets.MATTERMOST_URL }}
          MATTERMOST_BOT_TOKEN: ${{ secrets.MATTERMOST_BOT_TOKEN }}
          MATTERMOST_CHANNEL_ID: ${{ secrets.MATTERMOST_CHANNEL_ID }}
        run: |
          set -euo pipefail
          exec 9>/tmp/matou-swarm.lock
          flock -w 7200 9
          workdir="$HOME/swarm/$REPO_SLUG"
          mkdir -p "$workdir"
          cd "$workdir"
          url="https://swarm:${FORGEJO_TOKEN}@git.matou.nz/${REPO_SLUG}.git"
          if [ -d .git ]; then
            git remote set-url origin "$url"
            git fetch origin main
            git checkout -f main
            git reset --hard origin/main
          else
            git clone "$url" .
          fi
          bash .sandcastle/run-triage.sh
      - name: Investigate failure (healer)
        if: failure()
        env:
          FORGEJO_TOKEN: ${{ secrets.SWARM_FORGEJO_TOKEN }}
          FORGEJO_API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          MATTERMOST_URL: ${{ secrets.MATTERMOST_URL }}
          MATTERMOST_BOT_TOKEN: ${{ secrets.MATTERMOST_BOT_TOKEN }}
          MATTERMOST_CHANNEL_ID: ${{ secrets.MATTERMOST_CHANNEL_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}
          WORKFLOW: triage
          HEAL_DRY_RUN: "1"
        run: |
          bash "$HOME/swarm/${{ github.repository }}/.sandcastle/heal.sh" || {
            [ -z "$MATTERMOST_BOT_TOKEN" ] && exit 0
            jq -n --arg channel_id "$MATTERMOST_CHANNEL_ID" --arg message ":rotating_light: triage failed AND the healer errored in \`${{ github.repository }}\` — $RUN_URL" '{channel_id: $channel_id, message: $message}' |
              curl -sf -X POST -H "Authorization: Bearer $MATTERMOST_BOT_TOKEN" -H 'Content-Type: application/json' -d @- "$MATTERMOST_URL/api/v4/posts" || true
          }
