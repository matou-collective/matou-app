name: triage
on:
  issues:
    types: [opened, reopened]
  # Forgejo has been observed to silently stop firing a repo's schedules;
  # pushing a workflow file re-registers them (ourcloud's 2026-07-28
  # incident). If the cron below stops firing, that's the first thing to
  # check, not this file's logic.
  schedule:
    - cron: "5,35 * * * *"
  workflow_dispatch: {}

jobs:
  triage:
    runs-on: swarm
    timeout-minutes: 60
    steps:
      - name: Triage under global lock
        env:
          FORGEJO_TOKEN: ${{ secrets.SWARM_FORGEJO_TOKEN }}
          FORGEJO_API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          REPO_SLUG: ${{ github.repository }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          MATTERMOST_URL: ${{ secrets.MATTERMOST_URL }}
          MATTERMOST_BOT_TOKEN: ${{ secrets.MATTERMOST_BOT_TOKEN }}
          MATTERMOST_CHANNEL_ID: ${{ secrets.MATTERMOST_CHANNEL_ID }}
        run: |
          set -euo pipefail
          # Same global lock as swarm.yml, same yield-don't-camp rule: if the
          # host is busy, yield and let the cron (or the next issue event)
          # re-fire — triage is idempotent, so a deferred pass costs nothing.
          # Drive reservation (Matou/idss #663/#664). /tmp/matou-swarm.lock is
          # HOST-global and shared by every repo on this box, so the rehearsal
          # drive's reservation only works if every repo honours it: idss shipped
          # the guard and still starved 20 consecutive executor ticks (~40 min)
          # behind an unguarded sibling. The drive needs EVERY host lock at once
          # and yields the instant one is busy, so it loses unboundedly to any
          # repo that keeps claiming.
          #
          # Applied to the autonomous pollers ONLY (swarm, triage) — never to the
          # PR gates (verify.yml, pr-e2e.yml, smoke-drive.yml). Yielding here is
          # `exit 0`, which for a poller means "not this tick, the cron re-fires",
          # but on a PR check would be a FALSE GREEN: the gate would report
          # success without ever running. A human's PR must never be marked
          # passing because a rehearsal drive wanted the host.
          #
          # The mtime TTL is the anti-deadlock: a declarer killed by OOM/SIGKILL/
          # reboot runs no trap, and an abandoned reservation would otherwise
          # wedge every heavy job here until a human cleared /tmp. Keep 900 in
          # step with HOST_CAPACITY_DRIVE_WANTED_TTL in host-capacity-lib.sh.
          drive_res=/tmp/matou-drive-wanted
          if [ -f "$drive_res" ] \
            && [ "$(( $(date +%s) - $(stat -c %Y "$drive_res" 2>/dev/null || echo 0) ))" -lt 900 ]; then
            echo "triage: a rehearsal drive has reserved host capacity (idss #663) — yielding so it is not starved; the cron re-fires"
            exit 0
          fi
          exec 9>/tmp/matou-swarm.lock
          if ! flock -n 9; then
            echo "triage: another swarm/triage run holds /tmp/matou-swarm.lock — yielding; the cron re-fires"
            exit 0
          fi
          workdir="$HOME/swarm/$REPO_SLUG"
          mkdir -p "$workdir"
          cd "$workdir"
          host="${SERVER_URL#https://}"
          url="https://swarm:${FORGEJO_TOKEN}@${host}/${REPO_SLUG}.git"
          if [ -d .git ]; then
            git remote set-url origin "$url"
            git fetch origin main
            git checkout -f main
            git reset --hard origin/main
          else
            git clone "$url" .
          fi
          bash .sandcastle/run-triage.sh
      - name: Investigate failure (healer)
        if: failure()
        env:
          FORGEJO_TOKEN: ${{ secrets.SWARM_FORGEJO_TOKEN }}
          FORGEJO_API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          MATTERMOST_URL: ${{ secrets.MATTERMOST_URL }}
          MATTERMOST_BOT_TOKEN: ${{ secrets.MATTERMOST_BOT_TOKEN }}
          MATTERMOST_CHANNEL_ID: ${{ secrets.MATTERMOST_CHANNEL_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}
          WORKFLOW: triage
          # HEAL_DRY_RUN deliberately NOT set (Ben's ruling 2026-08-21, first applied
          # in Matou/idss): the healer files tickets and makes its ONE bounded
          # harness-infra repair for real. Set HEAL_DRY_RUN: "1" to return to
          # diagnose-only.
        run: |
          bash "$HOME/swarm/${{ github.repository }}/.sandcastle/heal.sh" || {
            [ -z "$MATTERMOST_BOT_TOKEN" ] && exit 0
            jq -n --arg channel_id "$MATTERMOST_CHANNEL_ID" --arg message ":rotating_light: triage failed AND the healer errored in \`${{ github.repository }}\` — $RUN_URL" '{channel_id: $channel_id, message: $message, props: {remove_link_preview: "true"}}' |
              curl -sf -X POST -H "Authorization: Bearer $MATTERMOST_BOT_TOKEN" -H 'Content-Type: application/json' -d @- "$MATTERMOST_URL/api/v4/posts" || true
          }
