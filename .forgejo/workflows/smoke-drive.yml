name: smoke-drive
# Standing smoke-tier e2e rehearsal drive (matou-app#41). Dispatch-only for now
# — a bare lap proves the platform stands up; pass a feature issue to showcase
# it on top of its auto-selected base. Emits the six-clause artifacts under
# test-results/smoke/<stamp>/ and posts the verdict + screenshots to Mattermost.
# Standing-drive scheduling (a periodic bare lap on cron) waits on
# Matou/dev-factory#3's host-state move — deliberately not wired here.
on:
  workflow_dispatch:
    inputs:
      base:
        description: "Base sub-journey: a (org-setup), b (org-setup→registration→invitation), or auto"
        required: false
        default: "auto"
      feature:
        description: "Optional feature issue number to showcase (feature-leg spec)"
        required: false
        default: ""

jobs:
  smoke-drive:
    runs-on: matou-workstation
    timeout-minutes: 45
    steps:
      - name: Smoke drive under global lock
        id: drive
        env:
          FORGEJO_TOKEN: ${{ secrets.SWARM_FORGEJO_TOKEN }}
          FORGEJO_API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          REPO_SLUG: ${{ github.repository }}
          BASE_INPUT: ${{ inputs.base }}
          FEATURE_INPUT: ${{ inputs.feature }}
          MATTERMOST_URL: ${{ secrets.MATTERMOST_URL }}
          MATTERMOST_BOT_TOKEN: ${{ secrets.MATTERMOST_BOT_TOKEN }}
          MATTERMOST_CHANNEL_ID: ${{ secrets.MATTERMOST_CHANNEL_ID }}
        run: |
          set -euo pipefail
          exec 9>/tmp/matou-swarm.lock
          # A lap that never ran must not show as a green run (matou-app#51:
          # a lock-skipped dispatch read as "success" with no run dir and was
          # mistaken for a lap). Fail the job, but flag it so the healer step
          # does not treat "the swarm held the lock" as a red journey.
          if ! flock -w 1800 9; then
            echo "smoke-drive: lock busy for 30min — NOT driven (re-dispatch when /tmp/matou-swarm.lock is free)"
            echo "lock_skipped=1" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "lock_skipped=0" >> "$GITHUB_OUTPUT"
          workdir="$HOME/swarm-e2e/$REPO_SLUG"
          mkdir -p "$workdir"
          cd "$workdir"
          url="https://swarm:${FORGEJO_TOKEN}@git.matou.nz/${REPO_SLUG}.git"
          # Drive the dispatched ref, not always main (matou-app#49): a
          # workflow_dispatch on a PR branch must live-verify THAT branch's tree
          # before merge. Default to main when no ref is given (manual/local run).
          ref="${GITHUB_REF_NAME:-main}"
          if [ -d .git ]; then
            git remote set-url origin "$url"
          else
            git clone "$url" .
          fi
          git fetch origin "$ref"
          git reset --hard FETCH_HEAD
          driven_sha="$(git rev-parse HEAD)"
          echo "smoke-drive: driving ref=$ref sha=$driven_sha"

          args=()
          case "${BASE_INPUT:-auto}" in a) args+=(--base a);; b) args+=(--base b);; esac
          [ -n "${FEATURE_INPUT:-}" ] && args+=(--feature "${FEATURE_INPUT#\#}")

          set +e
          bash scripts/smoke-drive/run-smoke-drive.sh "${args[@]}"
          drive_rc=$?
          set -e

          run_dir="$(ls -1dt test-results/smoke/*/ 2>/dev/null | head -1)"
          verdict="unknown"; legs="?"
          if [ -n "$run_dir" ] && [ -f "${run_dir}artifacts/verdict.json" ]; then
            verdict="$(jq -r '.verdict // "unknown"' "${run_dir}artifacts/verdict.json")"
            legs="$(jq -r '.legs_total // "?"' "${run_dir}artifacts/verdict.json")"
          fi

          shopt -s nullglob globstar
          shots=("${run_dir}"screenshots/**/*.png)
          shopt -u nullglob globstar

          feat_clause=""; [ -n "${FEATURE_INPUT:-}" ] && feat_clause=" feature #${FEATURE_INPUT#\#}"
          if [ "$verdict" = green ]; then
            msg=":green_circle: **smoke-drive** — ✅ green (${legs} legs${feat_clause}, ${#shots[@]} screenshots)"
          else
            msg=":red_circle: **smoke-drive** — ❌ ${verdict} (${legs} legs${feat_clause}, ${#shots[@]} screenshots)"
          fi
          bash .sandcastle/notify-mattermost-files.sh "$msg" "${shots[@]}" || \
            bash .sandcastle/notify-mattermost.sh "$msg" || true

          # The drive's own rc is the job result: a red journey fails the run so
          # the healer investigates (six-clause contract clause 6).
          exit "$drive_rc"
      - name: Investigate failure (healer)
        if: failure() && steps.drive.outputs.lock_skipped != '1'
        env:
          FORGEJO_TOKEN: ${{ secrets.SWARM_FORGEJO_TOKEN }}
          FORGEJO_API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN_B: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_B }}
          MATTERMOST_URL: ${{ secrets.MATTERMOST_URL }}
          MATTERMOST_BOT_TOKEN: ${{ secrets.MATTERMOST_BOT_TOKEN }}
          MATTERMOST_CHANNEL_ID: ${{ secrets.MATTERMOST_CHANNEL_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}
          WORKFLOW: smoke-drive
          # HEAL_DRY_RUN deliberately NOT set (Ben's ruling 2026-08-21, first applied
          # in Matou/idss): the healer files tickets and makes its ONE bounded
          # harness-infra repair for real. Set HEAL_DRY_RUN: "1" to return to
          # diagnose-only.
        run: |
          bash "$HOME/swarm-e2e/${{ github.repository }}/.sandcastle/heal.sh" || {
            [ -z "$MATTERMOST_BOT_TOKEN" ] && exit 0
            jq -n --arg channel_id "$MATTERMOST_CHANNEL_ID" --arg message ":rotating_light: smoke-drive failed AND the healer errored in \`${{ github.repository }}\` — $RUN_URL" '{channel_id: $channel_id, message: $message, props: {remove_link_preview: "true"}}' |
              curl -sf -X POST -H "Authorization: Bearer $MATTERMOST_BOT_TOKEN" -H 'Content-Type: application/json' -d @- "$MATTERMOST_URL/api/v4/posts" || true
          }
