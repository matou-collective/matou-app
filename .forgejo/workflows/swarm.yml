name: swarm
on:
  # `closed` only — never `labeled` (#103). Forgejo delivers BOTH a label add
  # and a label remove as one `issues` action, `label_updated`, with no `label`
  # field in the payload, and its matcher maps that action onto `labeled`. So
  # a label trigger cannot be narrowed to "ready-for-agent was added": every
  # claim/release toggle of `agent-working` re-fired this workflow, and under
  # the concurrency group below (which queues, never drops) a limit-parked
  # host that claimed-and-released N ready tickets per run queued ≥N successors
  # per run — 2,700 waiting no-op runs across four repos on 2026-08-26. Newly
  # readied tickets are picked up by the :15/:45 cron and by the D5 self-rearm
  # dispatch (report-lib.sh) instead.
  issues:
    types: [closed]
  schedule:
    - cron: "15,45 * * * *"
  workflow_dispatch: {}

# Concurrency: `cancel-in-progress: false` with NO group. On Forgejo 15 that is
# the ONE shape that means "never cancel, never queue" (services/actions/
# workflows.go ConfigureActionRunConcurrency → UnlimitedConcurrency). Every
# other shape serialises or cancels: a group + `false` is QueueBehind — the
# scheduler (GetAvailableJobsForRunner) hands a run's jobs to NO runner while an
# older run in the same group is still running; a group + `true` cancels the
# live worker; and no block at all falls back to the legacy auto group
# (ref+workflow+event), which cancels on push events.
#
# The per-RUN key this replaces (`swarm-<repo>-${{ github.run_number }}`, idss
# #1732) never de-serialised anything: Forgejo evaluates the group BEFORE the
# run is inserted, so run_number is 0 for every run and all of a repo's swarm
# runs shared one group — idss run 30959 started 6 s after 30954 ended, and once
# the per-host legs landed every new run sat `waiting` behind the previous run's
# workers (GOTCHAS 64). The per-REPO group before it (#26) serialised by design.
#
# Why no queue is right here: the storm a group once collapsed (#26 — a burst of
# events firing this workflow once per event) is held off by guards that are
# now load-bearing: the `closed`-only trigger (#103), the host-capacity flocks
# that yield a slot-less leg in seconds before any checkout, the ready-set-hash
# debounce (schedule_debounce_decide) and per-ticket claiming. A live worker's
# run is never cancelled by a later event (#38), and an idle host's leg is never
# held behind a busy host's ticket.
concurrency:
  cancel-in-progress: false

jobs:
  swarm:
    # ONE leg per pool host, each pinned to that host's own runner label (the
    # registry `name`, rendered at `onboard.sh workflows`), instead of N legs on
    # the pool label. Forgejo hands a pool-label job to whichever runner polls
    # first, and a host already mid-ticket still polls (its second runner slot
    # is free) — it took the leg, hit the per-repo workdir lock below, and threw
    # it away in seconds while a genuinely idle host never saw a job (GOTCHAS
    # 62: the 2-leg pool matrix let one host take BOTH legs of a run). With a
    # leg per host the busy host's leg still yields cheaply, but it can no
    # longer steal an idle host's turn. Per-ticket claiming keeps the legs from
    # duplicating work; fail-fast off: one host's red must not cancel another's
    # live work. A host leaves or joins this list by re-rendering, never by hand.
    runs-on: ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        host: [matou-workstation, elitebook-03, bens-mac-04]
    timeout-minutes: 180
    steps:
      - name: Swarm under global lock
        env:
          FORGEJO_TOKEN: ${{ secrets.SWARM_FORGEJO_TOKEN }}
          FORGEJO_API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          REPO_SLUG: ${{ github.repository }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN_B: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_B }}
          MATTERMOST_URL: ${{ secrets.MATTERMOST_URL }}
          MATTERMOST_BOT_TOKEN: ${{ secrets.MATTERMOST_BOT_TOKEN }}
          MATTERMOST_CHANNEL_ID: ${{ secrets.MATTERMOST_CHANNEL_ID }}
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}
          SWARM_RUN_ID: ${{ github.run_number }}
        run: |
          set -euo pipefail
          export SWARM_HOST="$(hostname)"
          # Yield-starvation signal (#213): a swarm yield is `exit 0` — a green
          # run — so N consecutive both-slots-busy losses for a repo with ready
          # tickets look identical to N healthy no-op ticks (a low-traffic repo
          # whose legs always lose while two long drains hold both slots on every
          # host starves with no signal, the only evidence the ABSENCE of a log).
          # The both-slots-busy gate below calls this to bump a per-repo
          # consecutive-yield counter and, at the threshold, write this repo's
          # want-file + comment on the oldest ready issue + post a Mattermost
          # notice. Runs the VENDORED signal script from the persisted workdir —
          # this gate fires before THIS tick's checkout, so a brand-new consumer's
          # very first burst (no prior checkout) is not covered here; run-swarm.sh
          # resets the counter on a real claim, and the next tick (once a checkout
          # lands) closes the gap. Best-effort: a missing script or a signal error
          # never changes the yield's clean exit.
          yield_signal() {
            local sig="$HOME/swarm/$REPO_SLUG/.sandcastle/swarm-yield-signal.sh"
            [ -f "$sig" ] && bash "$sig" "$1" || true
          }
          # Host capacity semaphore (idss #577, idss ADR 0184): TWO pooled
          # heavy slots shared by swarm AND triage across every repo on this
          # host. The slot + reservation paths come from the host's generated
          # host-capacity.env (factory-owned, ADR 0004 / #6) so they follow the
          # host-state cutover off /tmp into the host state dir (<home>/state,
          # #205/#218) in LOCKSTEP with the harness libs that flock the same
          # inodes — a guard left on /tmp while the libs moved would diverge
          # slot 2 and the drive reservation (double capacity / drive
          # starvation, GOTCHAS 67). Slot 1 keeps its historical base name under
          # the state dir; #205's /tmp compat symlink still bridges an unmodified
          # older pin for one cycle. Fall back to the harness-default state dir
          # if a host predates the generated file. First-fit, non-blocking: try
          # slot 1, then slot 2. Still never CAMP (idss #238) — both busy means
          # yield (exit 0) and let the :15/:45 cron (and the backstop) re-fire.
          cap_env="$HOME/factory-cron/host-capacity.env"
          [ -f "$cap_env" ] && . "$cap_env"
          state_dir="${HOST_CAPACITY_STATE_DIR:-$HOME/swarm/state}"
          set -- ${HOST_CAPACITY_SLOTS:-$state_dir/matou-swarm.lock $state_dir/matou-host-slot-2.lock}
          slot1="$1"; slot2="${2:-$1}"
          # Drive reservation (Matou/idss #663/#664). The rehearsal drive needs
          # EVERY host lock at once and yields the instant one is busy, so it
          # loses to any worker that claims a ticket in the gap — unboundedly,
          # not just slowly. The reservation file is HOST-global and shared by
          # every repo on this box, so a repo without this guard starves the
          # drive no matter how well-guarded the others are: idss was guarded and
          # a dev-factory run still held the slot for 20 consecutive ticks
          # (~40 min) before this landed.
          #
          # Stand down before taking a slot. Work already in flight is untouched,
          # so this costs at most one deferred claim. Inline because this runs
          # before the checkout exists. The mtime TTL is the anti-deadlock: a
          # declarer killed by OOM/SIGKILL/reboot (no trap runs) would otherwise
          # wedge every heavy job on this host until a human cleared the state.
          # Keep 900 in step with HOST_CAPACITY_DRIVE_WANTED_TTL in
          # host-capacity-lib.sh.
          #
          # The consecutive-defer count (idss #664) is THIS consumer's own,
          # distinct from the drive's own skip counter and from triage's/
          # session-runner's — three consumers on three cadences need three
          # independent streaks so "skipped 3" always means 3 ticks of THIS
          # worker, not a blend across consumers.
          drive_res="${HOST_CAPACITY_DRIVE_WANTED:-$state_dir/matou-drive-wanted}"
          defer_count="$state_dir/matou-swarm-drive-defer-count"
          if [ -f "$drive_res" ] \
            && [ "$(( $(date +%s) - $(stat -c %Y "$drive_res" 2>/dev/null || echo 0) ))" -lt 900 ]; then
            n="$(cat "$defer_count" 2>/dev/null || echo 0)"; case "$n" in ''|*[!0-9]*) n=0;; esac; n=$((n+1))
            echo "$n" >"$defer_count"
            echo "swarm: a rehearsal drive has reserved host capacity (idss #663) — deferring to a ready drive — skipped $n consecutive tick(s); the cron/backstop re-fires"
            exit 0
          fi
          rm -f "$defer_count"
          exec 9>"$slot1"
          held_slot="$slot1"
          if ! flock -n 9; then
            exec 9>&-
            exec 9>"$slot2"
            held_slot="$slot2"
            if ! flock -n 9; then
              echo "swarm: both host capacity slots busy — yielding; the cron/backstop re-fires"
              yield_signal slots-busy
              exit 0
            fi
          fi
          # The slot this job won, handed to the script so it can label the
          # slot with a holder sidecar (slot-aware fleet). The flock itself
          # stays on fd 9 here, exactly as before.
          export HOST_CAPACITY_HELD_SLOT="$held_slot"
          workdir="$HOME/swarm/$REPO_SLUG"
          mkdir -p "$workdir"
          # Per-repo-workdir lock (idss #638): a matrix sibling or triage
          # targeting the SAME repo can win a DIFFERENT host-capacity slot in
          # the same second and race this job's git mutation of the shared
          # clone (idss's `git reflog` showed the loser's checkout+reset
          # never landing — a bare red job, no worker log, no run row).
          # Scoped to ONLY the git setup below; it releases before
          # run-swarm.sh, so intra-host matrix parallelism during the run
          # itself is unchanged. Never camp (idss #238) — a workdir
          # mid-checkout just means this poll loses; the cron/backstop
          # re-fires.
          workdir_lock="/tmp/matou-workdir-$(printf '%s' "$REPO_SLUG" | tr '/' '-').lock"
          exec 8>"$workdir_lock"
          if ! flock -n 8; then
            echo "swarm: workdir $workdir busy with another job for this repo — yielding; the cron/backstop re-fires"
            exit 0
          fi
          cd "$workdir"
          # idss #639/idss #1423: route EVERY workdir through .sandcastle/git-setup.sh
          # — it does the retry-guarded fetch/checkout/reset, drops a TRANSPORT-aware
          # stage/exit/error verdict (idss #235/idss #1411) the healer keys a real
          # signature on, and wires the pre-push drift gate. git-setup.sh has shipped
          # in every established workdir since well before this commit (idss #639 is
          # long past), so the old inline pre-git-setup.sh fetch-or-reset FALLBACK is
          # retired: its bare, un-retried `git fetch` was the last un-retried
          # git-transport surface idss #1411 left (a transient Forgejo 5xx redded the
          # tick at stage one with a bare exit 128, no verdict).
          # git-setup.sh cannot bootstrap ITSELF onto disk, so a workdir that lacks it
          # — a genuinely fresh/empty clone, or (extinct in practice) a checkout frozen
          # since before idss #639 — is brought up to date inline FIRST, then handed to
          # git-setup.sh (which re-fetches idempotently and drops the verdict + hooks).
          # That cold-bootstrap is the one remaining inline network call, so it carries
          # the same bounded-retry-with-backoff posture as git-setup.sh (idss #1411): a
          # momentary blip is ridden out; a sustained outage still reds (the workdir was
          # never updated) and the NEXT tick, now carrying git-setup.sh, gets the full
          # TRANSPORT verdict. The cold-bootstrap keeps deriving the host from
          # github.server_url (onboarding/README.md's no-hardcoded-remote fix) rather
          # than copying git-setup.sh's own hardcoded default.
          if [ ! -f .sandcastle/git-setup.sh ]; then
            host="${SERVER_URL#https://}"
            # Credential-free origin (#195): the token never rides in the URL or on
            # argv. git-cred-lib.sh is not on disk in a cold clone, so inline its
            # token-free credential helper — a `get` handler that reads FORGEJO_TOKEN
            # from the job env at git-invocation time. git-setup.sh persists the same
            # helper into the workdir once present, so established ticks need no inline.
            url="https://${host}/${REPO_SLUG}.git"
            cred='credential.helper=!f(){ [ "$1" = get ] || exit 0; printf "username=swarm\npassword=%s\n" "${FORGEJO_TOKEN:-}"; }; f'
            # A real subshell with its OWN `set -e`, so a failing fetch aborts the
            # sequence instead of letting checkout/reset run against stale refs and
            # mask it (the pin git-setup.sh carries too).
            bootstrap() (
              set -e
              if [ -d .git ]; then
                git remote set-url origin "$url"
                git -c "$cred" fetch origin main
                git checkout -f main
                git reset --hard origin/main
              else
                git -c "$cred" clone "$url" .
              fi
            )
            attempt=1; delay=2
            until bootstrap; do
              [ "$attempt" -ge 3 ] && { echo "git-setup bootstrap: ${host} unreachable across $attempt attempt(s) — the tick is lost; the cron/backstop re-fires" >&2; exit 128; }
              echo "git-setup bootstrap: attempt $attempt failed, retrying in ${delay}s" >&2
              sleep "$delay"; delay=$((delay * 2)); attempt=$((attempt + 1))
            done
          fi
          WORKFLOW=swarm bash .sandcastle/git-setup.sh
          exec 8>&-
          bash .sandcastle/run-swarm.sh
      - name: Investigate failure (healer)
        if: failure()
        env:
          FORGEJO_TOKEN: ${{ secrets.SWARM_FORGEJO_TOKEN }}
          FORGEJO_API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN_B: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_B }}
          MATTERMOST_URL: ${{ secrets.MATTERMOST_URL }}
          MATTERMOST_BOT_TOKEN: ${{ secrets.MATTERMOST_BOT_TOKEN }}
          MATTERMOST_CHANNEL_ID: ${{ secrets.MATTERMOST_CHANNEL_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}
          WORKFLOW: swarm
          # HEAL_DRY_RUN deliberately NOT set (Ben's ruling 2026-08-21, first applied
          # in Matou/idss): the healer files tickets and makes its ONE bounded
          # harness-infra repair for real. Set HEAL_DRY_RUN: "1" to return to
          # diagnose-only.
        run: |
          bash "$HOME/swarm/${{ github.repository }}/.sandcastle/heal.sh" || {
            [ -z "$MATTERMOST_BOT_TOKEN" ] && exit 0
            jq -n --arg channel_id "$MATTERMOST_CHANNEL_ID" --arg message ":rotating_light: swarm failed AND the healer errored in \`${{ github.repository }}\` — $RUN_URL" '{channel_id: $channel_id, message: $message, props: {remove_link_preview: "true"}}' |
              curl -sf -X POST -H "Authorization: Bearer $MATTERMOST_BOT_TOKEN" -H 'Content-Type: application/json' -d @- "$MATTERMOST_URL/api/v4/posts" || true
          }
