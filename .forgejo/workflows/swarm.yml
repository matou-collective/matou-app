name: swarm
on:
  issues:
    types: [labeled, closed]
  schedule:
    - cron: "15,45 * * * *"
  workflow_dispatch: {}

jobs:
  swarm:
    # Label events fire for EVERY label; only ready-for-agent means new work.
    if: github.event_name != 'issues' || github.event.action != 'labeled' || github.event.label.name == 'ready-for-agent'
    runs-on: swarm
    strategy:
      # Two jobs per trigger: with per-ticket claiming, two hosts can safely
      # gang up on one repo's backlog. fail-fast off: one host's red must not
      # cancel the other's live work. Grow the matrix when the pool grows.
      fail-fast: false
      matrix:
        worker: [1, 2]
    timeout-minutes: 180
    steps:
      - name: Swarm under global lock
        env:
          FORGEJO_TOKEN: ${{ secrets.SWARM_FORGEJO_TOKEN }}
          FORGEJO_API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          REPO_SLUG: ${{ github.repository }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN_B: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_B }}
          MATTERMOST_URL: ${{ secrets.MATTERMOST_URL }}
          MATTERMOST_BOT_TOKEN: ${{ secrets.MATTERMOST_BOT_TOKEN }}
          MATTERMOST_CHANNEL_ID: ${{ secrets.MATTERMOST_CHANNEL_ID }}
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}
          SWARM_RUN_ID: ${{ github.run_number }}
        run: |
          set -euo pipefail
          export SWARM_HOST="$(hostname)"
          # /tmp/matou-swarm.lock is GLOBAL by design today: one heavy worker
          # per host, serializing every factory-driven repo sharing this host.
          # That's a known structural wall for a host running >1 repo's swarm
          # (ourcloud's #577) — unchanged here; #572 templates the workflow,
          # it doesn't re-solve host scheduling.
          exec 9>/tmp/matou-swarm.lock
          if ! flock -n 9; then
            echo "swarm: another swarm/triage run holds /tmp/matou-swarm.lock — yielding; the cron/backstop re-fires"
            exit 0
          fi
          workdir="$HOME/swarm/$REPO_SLUG"
          mkdir -p "$workdir"
          cd "$workdir"
          host="${SERVER_URL#https://}"
          url="https://swarm:${FORGEJO_TOKEN}@${host}/${REPO_SLUG}.git"
          if [ -d .git ]; then
            git remote set-url origin "$url"
            git fetch origin main
            git checkout -f main
            git reset --hard origin/main
          else
            git clone "$url" .
          fi
          bash .sandcastle/run-swarm.sh
      - name: Investigate failure (healer)
        if: failure()
        env:
          FORGEJO_TOKEN: ${{ secrets.SWARM_FORGEJO_TOKEN }}
          FORGEJO_API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN_B: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_B }}
          MATTERMOST_URL: ${{ secrets.MATTERMOST_URL }}
          MATTERMOST_BOT_TOKEN: ${{ secrets.MATTERMOST_BOT_TOKEN }}
          MATTERMOST_CHANNEL_ID: ${{ secrets.MATTERMOST_CHANNEL_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}
          WORKFLOW: swarm
          # HEAL_DRY_RUN deliberately NOT set (Ben's ruling 2026-08-21, first applied
          # in Matou/idss): the healer files tickets and makes its ONE bounded
          # harness-infra repair for real. Set HEAL_DRY_RUN: "1" to return to
          # diagnose-only.
        run: |
          bash "$HOME/swarm/${{ github.repository }}/.sandcastle/heal.sh" || {
            [ -z "$MATTERMOST_BOT_TOKEN" ] && exit 0
            jq -n --arg channel_id "$MATTERMOST_CHANNEL_ID" --arg message ":rotating_light: swarm failed AND the healer errored in \`${{ github.repository }}\` — $RUN_URL" '{channel_id: $channel_id, message: $message, props: {remove_link_preview: "true"}}' |
              curl -sf -X POST -H "Authorization: Bearer $MATTERMOST_BOT_TOKEN" -H 'Content-Type: application/json' -d @- "$MATTERMOST_URL/api/v4/posts" || true
          }
