name: swarm
on:
  # `closed` only — never `labeled` (Matou/dev-factory#103, GOTCHAS 32). Forgejo
  # delivers BOTH a label add and a label remove as one `issues` action,
  # `label_updated`, with no `label` field in the payload, and its matcher maps
  # that action onto `labeled`. So a label trigger cannot be narrowed to
  # "ready-for-agent was added": every claim/release toggle of `agent-working`
  # re-fired this workflow, and under the concurrency group below (which
  # queues, never drops) a limit-parked host that claimed-and-released N ready
  # tickets per run queued >=N successors per run — 2,700 waiting no-op runs
  # across four repos on 2026-08-26. Newly readied tickets are picked up by the
  # :15/:45 cron and by the D5 self-rearm dispatch instead.
  issues:
    types: [closed]
  schedule:
    - cron: "15,45 * * * *"
  workflow_dispatch: {}

# One workflow-level concurrency group per repo (#26). A triage mass-label or a
# burst of `closed` events otherwise fires this workflow once per event, and the
# 2-wide matrix doubles each — 71 dev-factory + 73 idss no-op runs in one hour
# were observed, each spinning a sandbox to conclude no-ready-tasks in ~6 s.
# Forgejo Actions honours workflow-level concurrency, but NOT GitHub's "at most
# one pending" collapse: with cancel-in-progress false it QUEUES every superseded
# run and executes them strictly in sequence. A burst of three qualifying events
# yields one running + TWO queued (N-1 for N events), not one queued — nothing is
# cancelled, nothing is dropped. The success signal is therefore zero cross-run
# overlap (serial execution), never a queue depth of 1 (verified live on
# Forgejo v15.0.5, #38).
# cancel-in-progress MUST stay false — a live worker's run is never cancelled by
# a later event (the matrix comment's fail-fast reasoning applies here too).
concurrency:
  group: swarm-${{ github.repository }}
  cancel-in-progress: false

jobs:
  swarm:
    runs-on: swarm
    strategy:
      # Two jobs per trigger: with per-ticket claiming, two hosts can safely
      # gang up on one repo's backlog. fail-fast off: one host's red must not
      # cancel the other's live work. Grow the matrix when the pool grows.
      fail-fast: false
      matrix:
        worker: [1, 2]
    timeout-minutes: 180
    steps:
      - name: Swarm under global lock
        env:
          FORGEJO_TOKEN: ${{ secrets.SWARM_FORGEJO_TOKEN }}
          FORGEJO_API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          REPO_SLUG: ${{ github.repository }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN_B: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_B }}
          MATTERMOST_URL: ${{ secrets.MATTERMOST_URL }}
          MATTERMOST_BOT_TOKEN: ${{ secrets.MATTERMOST_BOT_TOKEN }}
          MATTERMOST_CHANNEL_ID: ${{ secrets.MATTERMOST_CHANNEL_ID }}
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}
          SWARM_RUN_ID: ${{ github.run_number }}
        run: |
          set -euo pipefail
          export SWARM_HOST="$(hostname)"
          # Host capacity semaphore (idss #577, idss ADR 0184): TWO pooled
          # heavy slots shared by swarm AND triage across every repo on this
          # host — /tmp/matou-swarm.lock (slot 1, kept under its original
          # name so an unmodified sibling repo's workflow still excludes
          # correctly against it) and /tmp/matou-host-slot-2.lock (slot 2,
          # new capacity). First-fit, non-blocking: try slot 1, then slot 2.
          # Still never CAMP (idss #238) — both busy means yield (exit 0)
          # and let the :15/:45 cron (and the backstop) re-fire.
          # Drive reservation (Matou/idss #663/#664). The rehearsal drive needs
          # EVERY host lock at once and yields the instant one is busy, so it
          # loses to any worker that claims a ticket in the gap — unboundedly,
          # not just slowly. /tmp/matou-swarm.lock is HOST-global and shared by
          # every repo on this box, so a repo without this guard starves the
          # drive no matter how well-guarded the others are: idss was guarded and
          # a dev-factory run still held the slot for 20 consecutive ticks
          # (~40 min) before this landed.
          #
          # Stand down before taking a slot. Work already in flight is untouched,
          # so this costs at most one deferred claim. Inline because this runs
          # before the checkout exists. The mtime TTL is the anti-deadlock: a
          # declarer killed by OOM/SIGKILL/reboot (no trap runs) would otherwise
          # wedge every heavy job on this host until a human cleared /tmp. Keep
          # 900 in step with HOST_CAPACITY_DRIVE_WANTED_TTL in host-capacity-lib.sh.
          #
          # The consecutive-defer count (idss #664) is THIS consumer's own,
          # distinct from the drive's own skip counter and from triage's/
          # session-runner's — three consumers on three cadences need three
          # independent streaks so "skipped 3" always means 3 ticks of THIS
          # worker, not a blend across consumers.
          drive_res=/tmp/matou-drive-wanted
          defer_count=/tmp/matou-swarm-drive-defer-count
          if [ -f "$drive_res" ] \
            && [ "$(( $(date +%s) - $(stat -c %Y "$drive_res" 2>/dev/null || echo 0) ))" -lt 900 ]; then
            n="$(cat "$defer_count" 2>/dev/null || echo 0)"; case "$n" in ''|*[!0-9]*) n=0;; esac; n=$((n+1))
            echo "$n" >"$defer_count"
            echo "swarm: a rehearsal drive has reserved host capacity (idss #663) — deferring to a ready drive — skipped $n consecutive tick(s); the cron/backstop re-fires"
            exit 0
          fi
          rm -f "$defer_count"
          exec 9>/tmp/matou-swarm.lock
          held_slot=/tmp/matou-swarm.lock
          if ! flock -n 9; then
            exec 9>&-
            exec 9>/tmp/matou-host-slot-2.lock
            held_slot=/tmp/matou-host-slot-2.lock
            if ! flock -n 9; then
              echo "swarm: both host capacity slots busy — yielding; the cron/backstop re-fires"
              exit 0
            fi
          fi
          # The slot this job won, handed to the script so it can label the
          # slot with a holder sidecar (slot-aware fleet). The flock itself
          # stays on fd 9 here, exactly as before.
          export HOST_CAPACITY_HELD_SLOT="$held_slot"
          workdir="$HOME/swarm/$REPO_SLUG"
          mkdir -p "$workdir"
          # Per-repo-workdir lock (idss #638): a matrix sibling or triage
          # targeting the SAME repo can win a DIFFERENT host-capacity slot in
          # the same second and race this job's git mutation of the shared
          # clone (idss's `git reflog` showed the loser's checkout+reset
          # never landing — a bare red job, no worker log, no run row).
          # Scoped to ONLY the git setup below; it releases before
          # run-swarm.sh, so intra-host matrix parallelism during the run
          # itself is unchanged. Never camp (idss #238) — a workdir
          # mid-checkout just means this poll loses; the cron/backstop
          # re-fires.
          workdir_lock="/tmp/matou-workdir-$(printf '%s' "$REPO_SLUG" | tr '/' '-').lock"
          exec 8>"$workdir_lock"
          if ! flock -n 8; then
            echo "swarm: workdir $workdir busy with another job for this repo — yielding; the cron/backstop re-fires"
            exit 0
          fi
          cd "$workdir"
          # Un-wedge a workdir whose `.git` carries core.bare=true while a real
          # working tree is present (matou-app run 9093). git-setup.sh's
          # `git checkout -f main` then dies with "fatal: this operation must be
          # run in a work tree" (exit 128) on EVERY subsequent run — and because
          # the checkout is what refreshes .sandcastle/, a fix shipped in
          # git-setup.sh itself can never reach the wedged workdir. Forgejo reads
          # this workflow from the repo server-side, not from the workdir, so the
          # guard has to live here to be able to land at all. Idempotent, and
          # scoped to the provably-invalid state (bare flag + tracked files on
          # disk); runs under the workdir lock taken just above, so nothing else
          # is touching .git. The condition is self-contradictory by construction —
          # a genuinely bare repo has no `.git` SUBDIRECTORY — so this can never
          # fire on a real bare repo, and it is a no-op on a healthy workdir.
          # Never fails the job: a repo we cannot read is left as-is for
          # git-setup.sh to verdict on.
          if [ -d .git ] && [ "$(git rev-parse --is-bare-repository 2>/dev/null)" = true ]; then
            echo "swarm: workdir .git has core.bare=true but a working tree is present — clearing it (checkout would exit 128)"
            git config --bool core.bare false || true
          fi
          # idss #639: once a prior run has checked out .sandcastle/git-setup.sh,
          # route through it so a git-setup failure — before run-swarm.sh even
          # starts and can verdict_begin its own stages — still drops a
          # stage/exit/error verdict the healer keys a real signature on,
          # instead of collapsing onto the bare workflow-name signature. A
          # workdir that hasn't pulled this commit yet (git-setup.sh absent —
          # a genuinely fresh clone, OR an existing checkout one fetch behind)
          # falls back to the exact pre-git-setup.sh inline fetch-or-clone
          # below, no verdict; the NEXT run (now carrying git-setup.sh) uses
          # the script. The fallback keeps deriving the host from
          # github.server_url (onboarding/README.md's no-hardcoded-remote
          # fix) rather than copying git-setup.sh's own hardcoded default.
          if [ -f .sandcastle/git-setup.sh ]; then
            WORKFLOW=swarm bash .sandcastle/git-setup.sh
          else
            host="${SERVER_URL#https://}"
            url="https://swarm:${FORGEJO_TOKEN}@${host}/${REPO_SLUG}.git"
            if [ -d .git ]; then
              git remote set-url origin "$url"
              git fetch origin main
              git checkout -f main
              git reset --hard origin/main
            else
              git clone "$url" .
            fi
          fi
          exec 8>&-
          bash .sandcastle/run-swarm.sh
      - name: Investigate failure (healer)
        if: failure()
        env:
          FORGEJO_TOKEN: ${{ secrets.SWARM_FORGEJO_TOKEN }}
          FORGEJO_API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN_B: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_B }}
          MATTERMOST_URL: ${{ secrets.MATTERMOST_URL }}
          MATTERMOST_BOT_TOKEN: ${{ secrets.MATTERMOST_BOT_TOKEN }}
          MATTERMOST_CHANNEL_ID: ${{ secrets.MATTERMOST_CHANNEL_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}
          WORKFLOW: swarm
          # HEAL_DRY_RUN deliberately NOT set (Ben's ruling 2026-08-21, first applied
          # in Matou/idss): the healer files tickets and makes its ONE bounded
          # harness-infra repair for real. Set HEAL_DRY_RUN: "1" to return to
          # diagnose-only.
        run: |
          bash "$HOME/swarm/${{ github.repository }}/.sandcastle/heal.sh" || {
            [ -z "$MATTERMOST_BOT_TOKEN" ] && exit 0
            jq -n --arg channel_id "$MATTERMOST_CHANNEL_ID" --arg message ":rotating_light: swarm failed AND the healer errored in \`${{ github.repository }}\` — $RUN_URL" '{channel_id: $channel_id, message: $message, props: {remove_link_preview: "true"}}' |
              curl -sf -X POST -H "Authorization: Bearer $MATTERMOST_BOT_TOKEN" -H 'Content-Type: application/json' -d @- "$MATTERMOST_URL/api/v4/posts" || true
          }
