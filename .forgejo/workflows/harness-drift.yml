name: harness-drift
# Shared Sandcastle harness files are vendored byte-identical from
# Matou/dev-factory at the pinned .sandcastle/FACTORY_REF (ADR 0180 / #571);
# this reds CI if a vendored copy here drifted from that ref. Fix belongs in
# dev-factory — land it there, bump FACTORY_REF, re-vendor (or drop the file
# from FACTORY_MANIFEST if it must diverge here).
on:
  push:
    branches: [main]
    paths: ['.sandcastle/**']
  pull_request:
    paths: ['.sandcastle/**']
  workflow_dispatch: {}
jobs:
  drift:
    runs-on: swarm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: bash .sandcastle/check-harness-drift.sh
