name: harness-drift
# Generated by ourcloud sync-harness.sh (#250). Shared Sandcastle harness files
# are canonical in Matou/ourcloud; this reds CI if a copy here was edited
# directly. Fix belongs in ourcloud (or the file belongs out of the manifest).
on:
  push:
    branches: [main]
    paths: ['.sandcastle/**']
  pull_request:
    paths: ['.sandcastle/**']
  workflow_dispatch: {}
jobs:
  drift:
    runs-on: matou-workstation
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: bash .sandcastle/check-harness-drift.sh
