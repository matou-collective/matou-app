name: verify
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: swarm
    timeout-minutes: 20
    steps:
      - name: Check Mattermost verifications under global lock
        env:
          FORGEJO_TOKEN: ${{ secrets.SWARM_FORGEJO_TOKEN }}
          FORGEJO_API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          REPO_SLUG: ${{ github.repository }}
          MATTERMOST_URL: ${{ secrets.MATTERMOST_URL }}
          MATTERMOST_BOT_TOKEN: ${{ secrets.MATTERMOST_BOT_TOKEN }}
          MATTERMOST_CHANNEL_ID: ${{ secrets.MATTERMOST_CHANNEL_ID }}
        run: |
          set -euo pipefail
          exec 9>/tmp/matou-swarm.lock
          # Non-blocking: a long swarm run can hold the lock for hours — a
          # poller should skip quietly and let the next cron tick retry, not
          # go red every 10 minutes.
          flock -n 9 || { echo "verify: swarm lock busy — skipping this tick"; exit 0; }
          workdir="$HOME/swarm/$REPO_SLUG"
          mkdir -p "$workdir"
          cd "$workdir"
          # Un-wedge a workdir whose `.git` carries core.bare=true while a real
          # working tree is present (matou-app run 9093, again run 12813). The
          # git-sync step below — inline here or inside run-verify.sh — then dies
          # at `git checkout -f main` with "fatal: this operation must be run in a
          # work tree" (exit 128) on EVERY tick that wins the swarm lock, and no
          # fix shipped inside .sandcastle/ can ever reach the workdir because the
          # checkout that would refresh it is the very thing failing. swarm.yml and
          # triage.yml already carry this guard; verify.yml was the last workdir
          # consumer without it, so a wedge cleared by a swarm/triage tick would
          # silently re-red verify alone. Forgejo reads this workflow server-side,
          # not from the workdir, so the guard has to live here to land at all.
          # Idempotent, and scoped to the provably-invalid state (bare flag +
          # a `.git` SUBDIRECTORY, which a genuinely bare repo never has), so it
          # can never fire on a real bare repo and is a no-op on a healthy
          # workdir. Never fails the job: a repo we cannot read is left as-is for
          # run-verify.sh to verdict on.
          if [ -d .git ] && [ "$(git rev-parse --is-bare-repository 2>/dev/null)" = true ]; then
            echo "verify: workdir .git has core.bare=true but a working tree is present — clearing it (checkout would exit 128)"
            git config --bool core.bare false || true
          fi
          # Route through run-verify.sh (#228) so a git-sync or check-verifications
          # failure drops a stage/exit/error verdict the healer keys a real
          # signature on, instead of collapsing every red verify onto the bare
          # `verify|` signature (the poller writes nothing to worker-logs.txt, so
          # the healer's legacy degrade path had nothing to grep). A workdir that
          # hasn't pulled this commit yet (run-verify.sh absent — a fresh clone or
          # a checkout one fetch behind) falls back to the pre-#228 inline body,
          # no verdict; the NEXT run (now carrying run-verify.sh) uses the script.
          # Same one-run-lag shape as triage.yml's git-setup.sh gate (#639).
          if [ -f .sandcastle/run-verify.sh ]; then
            bash .sandcastle/run-verify.sh
          else
            host="${SERVER_URL#https://}"
            url="https://swarm:${FORGEJO_TOKEN}@${host}/${REPO_SLUG}.git"
            if [ -d .git ]; then
              git remote set-url origin "$url"
              git fetch origin main
              git checkout -f main
              git reset --hard origin/main
            else
              git clone "$url" .
            fi
            bash .sandcastle/check-verifications.sh
          fi
      - name: Investigate failure (healer)
        if: failure()
        env:
          FORGEJO_TOKEN: ${{ secrets.SWARM_FORGEJO_TOKEN }}
          FORGEJO_API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN_B: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_B }}
          MATTERMOST_URL: ${{ secrets.MATTERMOST_URL }}
          MATTERMOST_BOT_TOKEN: ${{ secrets.MATTERMOST_BOT_TOKEN }}
          MATTERMOST_CHANNEL_ID: ${{ secrets.MATTERMOST_CHANNEL_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}
          WORKFLOW: verify
          # HEAL_DRY_RUN deliberately NOT set (Ben's ruling 2026-08-21, first applied
          # in Matou/idss): the healer files tickets and makes its ONE bounded
          # harness-infra repair for real. Set HEAL_DRY_RUN: "1" to return to
          # diagnose-only.
        run: |
          bash "$HOME/swarm/${{ github.repository }}/.sandcastle/heal.sh" || {
            [ -z "$MATTERMOST_BOT_TOKEN" ] && exit 0
            jq -n --arg channel_id "$MATTERMOST_CHANNEL_ID" --arg message ":rotating_light: verify failed AND the healer errored in \`${{ github.repository }}\` — $RUN_URL" '{channel_id: $channel_id, message: $message, props: {remove_link_preview: "true"}}' |
              curl -sf -X POST -H "Authorization: Bearer $MATTERMOST_BOT_TOKEN" -H 'Content-Type: application/json' -d @- "$MATTERMOST_URL/api/v4/posts" || true
          }
